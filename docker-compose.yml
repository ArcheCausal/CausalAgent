# CausalAgent MySQL 主从 + PostgreSQL checkpoint 开发

services:
  mysql-primary:
    build:
      context: ./Database/mysql
      dockerfile: Dockerfile.primary
    container_name: causalagent_mysql_primary
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_WRITE_USER: ${MYSQL_WRITE_USER:-${MYSQL_USER}}
      MYSQL_WRITE_PASSWORD: ${MYSQL_WRITE_PASSWORD:-${MYSQL_PASSWORD}}
      MYSQL_READ_USER: ${MYSQL_READ_USER:-${MYSQL_USER}}
      MYSQL_READ_PASSWORD: ${MYSQL_READ_PASSWORD:-${MYSQL_PASSWORD}}
      MYSQL_REPLICA_STATUS_USER: ${MYSQL_REPLICA_STATUS_USER:-}
      MYSQL_REPLICA_STATUS_PASSWORD: ${MYSQL_REPLICA_STATUS_PASSWORD:-}
      MYSQL_REPLICATION_USER: ${MYSQL_REPLICATION_USER:-replica}
      MYSQL_REPLICATION_PASSWORD: ${MYSQL_REPLICATION_PASSWORD}
    ports:
      - "3307:3306"
    volumes:
      - mysql_primary_data:/var/lib/mysql
    networks:
      - causalagent_replica_network
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=\"$$MYSQL_ROOT_PASSWORD\" mysqladmin ping --protocol=tcp -h 127.0.0.1 -P 3306 -u root"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  postgres-checkpoint:
    image: postgres:16-alpine
    container_name: causalagent_postgres_checkpoint
    environment:
      POSTGRES_DB: ${CHECKPOINT_POSTGRES_DATABASE:-causalagent_checkpoints}
      POSTGRES_USER: ${CHECKPOINT_POSTGRES_USER:-causalagent_checkpoint}
      POSTGRES_PASSWORD: ${CHECKPOINT_POSTGRES_PASSWORD:?CHECKPOINT_POSTGRES_PASSWORD must be set}
    ports:
      - "5433:5432"
    volumes:
      - postgres_checkpoint_data:/var/lib/postgresql/data
    networks:
      - causalagent_replica_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  mysql-replica:
    build:
      context: ./Database/mysql
      dockerfile: Dockerfile.replica
    container_name: causalagent_mysql_replica
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_REPLICATION_USER: ${MYSQL_REPLICATION_USER:-replica}
      MYSQL_REPLICATION_PASSWORD: ${MYSQL_REPLICATION_PASSWORD}
    ports:
      - "3308:3306"
    volumes:
      - mysql_replica_data:/var/lib/mysql
    networks:
      - causalagent_replica_network
    depends_on:
      mysql-primary:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=\"$$MYSQL_ROOT_PASSWORD\" mysqladmin ping --protocol=tcp -h 127.0.0.1 -P 3306 -u root"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: causalagent_app
    command: ["sh", "-c", "exec gunicorn --bind 0.0.0.0:5001 --workers ${WEB_WORKERS:-1} --threads ${WEB_THREADS:-12} --timeout ${WEB_TIMEOUT:-120} CausalAgent:app"]
    labels:
      causalagent_observability: "true"
      causalagent_service: "web"
      causalagent_environment: "development"
    environment:
      - MYSQL_HOST=mysql-primary
      - MYSQL_WRITE_HOST=mysql-primary
      - MYSQL_READ_HOSTS=mysql-replica
      - MYSQL_PORT=3306
      - MYSQL_USER=${MYSQL_USER}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
      - MYSQL_WRITE_USER=${MYSQL_WRITE_USER:-${MYSQL_USER}}
      - MYSQL_WRITE_PASSWORD=${MYSQL_WRITE_PASSWORD:-${MYSQL_PASSWORD}}
      - MYSQL_READ_USER=${MYSQL_READ_USER:-${MYSQL_USER}}
      - MYSQL_READ_PASSWORD=${MYSQL_READ_PASSWORD:-${MYSQL_PASSWORD}}
      - MYSQL_REPLICA_STATUS_USER=${MYSQL_REPLICA_STATUS_USER:-}
      - MYSQL_REPLICA_STATUS_PASSWORD=${MYSQL_REPLICA_STATUS_PASSWORD:-}
      - MYSQL_DATABASE=${MYSQL_DATABASE}
      - MYSQL_POOL_SIZE_WRITE=${MYSQL_POOL_SIZE_WRITE:-5}
      - MYSQL_POOL_SIZE_READ=${MYSQL_POOL_SIZE_READ:-5}
      - MYSQL_CONNECT_TIMEOUT_SECONDS=${MYSQL_CONNECT_TIMEOUT_SECONDS:-5}
      - MYSQL_POOL_ACQUIRE_TIMEOUT_SECONDS=${MYSQL_POOL_ACQUIRE_TIMEOUT_SECONDS:-3}
      - MYSQL_POOL_ACQUIRE_RETRY_MS=${MYSQL_POOL_ACQUIRE_RETRY_MS:-50}
      - MYSQL_REPLICA_MAX_LAG_SECONDS=${MYSQL_REPLICA_MAX_LAG_SECONDS:-2}
      - MYSQL_REPLICA_STATUS_CACHE_SECONDS=${MYSQL_REPLICA_STATUS_CACHE_SECONDS:-2}
      - MYSQL_QUERY_WARN_MS=${MYSQL_QUERY_WARN_MS:-500}
      - CHECKPOINT_POSTGRES_HOST=postgres-checkpoint
      - CHECKPOINT_POSTGRES_PORT=5432
      - CHECKPOINT_POSTGRES_DATABASE=${CHECKPOINT_POSTGRES_DATABASE:-causalagent_checkpoints}
      - CHECKPOINT_POSTGRES_USER=${CHECKPOINT_POSTGRES_USER:-causalagent_checkpoint}
      - CHECKPOINT_POSTGRES_PASSWORD=${CHECKPOINT_POSTGRES_PASSWORD}
      - CHECKPOINT_POSTGRES_CONNECT_TIMEOUT_SECONDS=${CHECKPOINT_POSTGRES_CONNECT_TIMEOUT_SECONDS:-5}
      - CHECKPOINT_POSTGRES_POOL_MIN_SIZE=${CHECKPOINT_POSTGRES_POOL_MIN_SIZE:-1}
      - CHECKPOINT_POSTGRES_POOL_MAX_SIZE=${CHECKPOINT_POSTGRES_POOL_MAX_SIZE:-5}
      - ADMIN_BATCH_MAX_TARGETS=${ADMIN_BATCH_MAX_TARGETS:-20}
      - ADMIN_DELETE_MAX_RELATED_ROWS=${ADMIN_DELETE_MAX_RELATED_ROWS:-10000}
      - ADMIN_DB_LOCK_WAIT_TIMEOUT_SECONDS=${ADMIN_DB_LOCK_WAIT_TIMEOUT_SECONDS:-5}
      - DB_INSPECTION_QUERY_TIMEOUT_MS=${DB_INSPECTION_QUERY_TIMEOUT_MS:-3000}
      - DB_DASHBOARD_CONNECTION_WARNING_PERCENT=${DB_DASHBOARD_CONNECTION_WARNING_PERCENT:-70}
      - DB_DASHBOARD_CONNECTION_CRITICAL_PERCENT=${DB_DASHBOARD_CONNECTION_CRITICAL_PERCENT:-85}
      - DB_MONITOR_AUTO_REFRESH_ENABLED=${DB_MONITOR_AUTO_REFRESH_ENABLED:-true}
      - DB_MONITOR_REALTIME_INTERVAL_SECONDS=${DB_MONITOR_REALTIME_INTERVAL_SECONDS:-10}
      - DB_MONITOR_SQL_INTERVAL_SECONDS=${DB_MONITOR_SQL_INTERVAL_SECONDS:-60}
      - DB_MONITOR_TABLE_CAPACITY_INTERVAL_SECONDS=${DB_MONITOR_TABLE_CAPACITY_INTERVAL_SECONDS:-900}
      - DB_MONITOR_SLOW_QUERY_WARNING_DELTA=${DB_MONITOR_SLOW_QUERY_WARNING_DELTA:-1}
      - DB_MONITOR_INTEGRITY_ENABLED=${DB_MONITOR_INTEGRITY_ENABLED:-false}
      - DB_MONITOR_INTEGRITY_INTERVAL_SECONDS=${DB_MONITOR_INTEGRITY_INTERVAL_SECONDS:-86400}
      - ADMIN_VITE_DEV_SERVER_URL=${ADMIN_VITE_DEV_SERVER_URL:-}
      - WEBSITE_FRONTEND_DIST_DIR=${WEBSITE_FRONTEND_DIST_DIR:-/opt/causalagent-website}
      - WEBSITE_VITE_DEV_SERVER_URL=${WEBSITE_VITE_DEV_SERVER_URL:-}
      - CHAT_FRONTEND_DIST_DIR=${CHAT_FRONTEND_DIST_DIR:-/opt/causalagent-chat}
      - CHAT_VITE_DEV_SERVER_URL=${CHAT_VITE_DEV_SERVER_URL:-}
      - RAG_EVAL_FRONTEND_DIST_DIR=${RAG_EVAL_FRONTEND_DIST_DIR:-/opt/causalagent-rag-eval}
      - GRAFANA_PUBLIC_URL=${GRAFANA_PUBLIC_URL:-http://127.0.0.1:3000/grafana/}
      - WEB_WORKERS=${WEB_WORKERS:-1}
      - WEB_THREADS=${WEB_THREADS:-12}
      - WEB_TIMEOUT=${WEB_TIMEOUT:-120}
      - SSE_POLL_INTERVAL_SECONDS=${SSE_POLL_INTERVAL_SECONDS:-0.05}
      - JOB_WORKERS=${JOB_WORKERS:-2}
      - JOB_HEARTBEAT_INTERVAL_SECONDS=${JOB_HEARTBEAT_INTERVAL_SECONDS:-10}
      - JOB_STALE_AFTER_SECONDS=${JOB_STALE_AFTER_SECONDS:-120}
      - JOB_MAX_ATTEMPTS=${JOB_MAX_ATTEMPTS:-3}
      - JOB_CHAT_HISTORY_LIMIT=${JOB_CHAT_HISTORY_LIMIT:-20}
      - WEB_SEARCH_PROVIDER=${WEB_SEARCH_PROVIDER:-searxng}
      - SEARXNG_URL=${SEARXNG_URL:-http://searxng:8080}
      - RAG_EVAL_ROOT=/app/tmp/rag_eval
      - RAG_EVAL_DATASET_ROOT=/app/tmp/rag_eval/datasets/registered
      - MAX_UPLOAD_SIZE_MB=${MAX_UPLOAD_SIZE_MB:-20}
      - API_KEY=${API_KEY}
      - BASE_URL=${BASE_URL}
      - MODEL=${MODEL}
      - EMBEDDING_API_KEY=${EMBEDDING_API_KEY:-}
      - EMBEDDING_BASE_URL=${EMBEDDING_BASE_URL:-}
      - EMBEDDING_MODEL=${EMBEDDING_MODEL:-qwen3.7-text-embedding}
      - SECRET_KEY=${SECRET_KEY}
      - FLASK_ENV=development
      - LANGCHAIN_API_KEY=${LANGCHAIN_API_KEY:-}
      - LANGCHAIN_PROJECT=${LANGCHAIN_PROJECT:-}
    ports:
      - "5001:5001"
    volumes:
      - .:/app
      - /app/__pycache__
      - /app/杂项
      - ./Agent/knowledge_base/models:/app/Agent/knowledge_base/models:ro
      - ./Agent/knowledge_base/db:/app/Agent/knowledge_base/db
      - kb_multimodal_indexes:/app/Agent/knowledge_base/multimodal_indexes
      - ./tmp/rag_eval:/app/tmp/rag_eval
    depends_on:
      mysql-primary:
        condition: service_healthy
      mysql-replica:
        condition: service_healthy
      db-bootstrap:
        condition: service_completed_successfully
      kb-indexes-sync:
        condition: service_completed_successfully
    networks:
      - causalagent_replica_network
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: causalagent_worker
    labels:
      causalagent_observability: "true"
      causalagent_service: "worker"
      causalagent_environment: "development"
    command: python -m app.agent.worker
    environment:
      - MYSQL_HOST=mysql-primary
      - MYSQL_WRITE_HOST=mysql-primary
      - MYSQL_READ_HOSTS=mysql-replica
      - MYSQL_PORT=3306
      - MYSQL_USER=${MYSQL_USER}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
      - MYSQL_WRITE_USER=${MYSQL_WRITE_USER:-${MYSQL_USER}}
      - MYSQL_WRITE_PASSWORD=${MYSQL_WRITE_PASSWORD:-${MYSQL_PASSWORD}}
      - MYSQL_READ_USER=${MYSQL_READ_USER:-${MYSQL_USER}}
      - MYSQL_READ_PASSWORD=${MYSQL_READ_PASSWORD:-${MYSQL_PASSWORD}}
      - MYSQL_REPLICA_STATUS_USER=${MYSQL_REPLICA_STATUS_USER:-}
      - MYSQL_REPLICA_STATUS_PASSWORD=${MYSQL_REPLICA_STATUS_PASSWORD:-}
      - MYSQL_DATABASE=${MYSQL_DATABASE}
      - MYSQL_POOL_SIZE_WRITE=${MYSQL_POOL_SIZE_WRITE:-5}
      - MYSQL_POOL_SIZE_READ=${MYSQL_POOL_SIZE_READ:-5}
      - MYSQL_CONNECT_TIMEOUT_SECONDS=${MYSQL_CONNECT_TIMEOUT_SECONDS:-5}
      - MYSQL_POOL_ACQUIRE_TIMEOUT_SECONDS=${MYSQL_POOL_ACQUIRE_TIMEOUT_SECONDS:-3}
      - MYSQL_POOL_ACQUIRE_RETRY_MS=${MYSQL_POOL_ACQUIRE_RETRY_MS:-50}
      - MYSQL_REPLICA_MAX_LAG_SECONDS=${MYSQL_REPLICA_MAX_LAG_SECONDS:-2}
      - MYSQL_REPLICA_STATUS_CACHE_SECONDS=${MYSQL_REPLICA_STATUS_CACHE_SECONDS:-2}
      - MYSQL_QUERY_WARN_MS=${MYSQL_QUERY_WARN_MS:-500}
      - CHECKPOINT_POSTGRES_HOST=postgres-checkpoint
      - CHECKPOINT_POSTGRES_PORT=5432
      - CHECKPOINT_POSTGRES_DATABASE=${CHECKPOINT_POSTGRES_DATABASE:-causalagent_checkpoints}
      - CHECKPOINT_POSTGRES_USER=${CHECKPOINT_POSTGRES_USER:-causalagent_checkpoint}
      - CHECKPOINT_POSTGRES_PASSWORD=${CHECKPOINT_POSTGRES_PASSWORD}
      - CHECKPOINT_POSTGRES_CONNECT_TIMEOUT_SECONDS=${CHECKPOINT_POSTGRES_CONNECT_TIMEOUT_SECONDS:-5}
      - CHECKPOINT_POSTGRES_POOL_MIN_SIZE=${CHECKPOINT_POSTGRES_POOL_MIN_SIZE:-1}
      - CHECKPOINT_POSTGRES_POOL_MAX_SIZE=${CHECKPOINT_POSTGRES_POOL_MAX_SIZE:-5}
      - JOB_WORKERS=${JOB_WORKERS:-2}
      - JOB_HEARTBEAT_INTERVAL_SECONDS=${JOB_HEARTBEAT_INTERVAL_SECONDS:-10}
      - JOB_STALE_AFTER_SECONDS=${JOB_STALE_AFTER_SECONDS:-120}
      - JOB_DRAIN_TIMEOUT_SECONDS=${JOB_DRAIN_TIMEOUT_SECONDS:-60}
      - JOB_MAX_ATTEMPTS=${JOB_MAX_ATTEMPTS:-3}
      - JOB_CHAT_HISTORY_LIMIT=${JOB_CHAT_HISTORY_LIMIT:-20}
      - WEB_SEARCH_PROVIDER=${WEB_SEARCH_PROVIDER:-searxng}
      - SEARXNG_URL=${SEARXNG_URL:-http://searxng:8080}
      - API_KEY=${API_KEY}
      - BASE_URL=${BASE_URL}
      - MODEL=${MODEL}
      - DEEP_AGENT_MODEL=${DEEP_AGENT_MODEL:-deepseek-v4-flash}
      - DEEP_AGENT_BASE_URL=${DEEP_AGENT_BASE_URL:-${BASE_URL}}
      - DEEP_AGENT_API_KEY=${DEEP_AGENT_API_KEY:-${API_KEY}}
      - DEEP_AGENT_CONTEXT_WINDOW_TOKENS=${DEEP_AGENT_CONTEXT_WINDOW_TOKENS:-1000000}
      - EMBEDDING_API_KEY=${EMBEDDING_API_KEY:-}
      - EMBEDDING_BASE_URL=${EMBEDDING_BASE_URL:-}
      - EMBEDDING_MODEL=${EMBEDDING_MODEL:-qwen3.7-text-embedding}
      - SECRET_KEY=${SECRET_KEY}
      - FLASK_ENV=development
      - LANGCHAIN_API_KEY=${LANGCHAIN_API_KEY:-}
      - LANGCHAIN_PROJECT=${LANGCHAIN_PROJECT:-}
      - CAUSAL_MCP_URL=http://causal-mcp:8080/mcp
      - CAUSAL_MCP_SERVICE_TOKEN=${CAUSAL_MCP_SERVICE_TOKEN:-local-causal-mcp-token}
      - CAUSAL_MCP_SIGNING_KEY_CURRENT=${CAUSAL_MCP_SIGNING_KEY_CURRENT:-local-causal-mcp-signing-key}
      - CAUSAL_MCP_SIGNING_KEY_ID=${CAUSAL_MCP_SIGNING_KEY_ID:-current}
      - CAUSAL_MCP_CLIENT_POOL_SIZE=${CAUSAL_MCP_CLIENT_POOL_SIZE:-2}
      - CAUSAL_MCP_MAX_IN_FLIGHT_PER_CLIENT=${CAUSAL_MCP_MAX_IN_FLIGHT_PER_CLIENT:-1}
      - CAUSAL_MCP_POOL_ACQUIRE_TIMEOUT_SECONDS=${CAUSAL_MCP_POOL_ACQUIRE_TIMEOUT_SECONDS:-5}
      - CAUSAL_MCP_CONTROL_POOL_SIZE=${CAUSAL_MCP_CONTROL_POOL_SIZE:-1}
      - CAUSAL_MCP_CONTROL_MAX_IN_FLIGHT_PER_CLIENT=${CAUSAL_MCP_CONTROL_MAX_IN_FLIGHT_PER_CLIENT:-2}
      - CAUSAL_MCP_CONTROL_ACQUIRE_TIMEOUT_SECONDS=${CAUSAL_MCP_CONTROL_ACQUIRE_TIMEOUT_SECONDS:-1}
      - CAUSAL_MCP_CANCEL_TIMEOUT_SECONDS=${CAUSAL_MCP_CANCEL_TIMEOUT_SECONDS:-6}
      - CAUSAL_MCP_HTTP_MAX_CONNECTIONS=${CAUSAL_MCP_HTTP_MAX_CONNECTIONS:-8}
      - CAUSAL_MCP_HTTP_MAX_KEEPALIVE_CONNECTIONS=${CAUSAL_MCP_HTTP_MAX_KEEPALIVE_CONNECTIONS:-4}
      - CAUSAL_MCP_HTTP_READ_TIMEOUT_SECONDS=${CAUSAL_MCP_HTTP_READ_TIMEOUT_SECONDS:-660}
    volumes:
      - .:/app
      - /app/__pycache__
      - /app/杂项
      - ./Agent/knowledge_base/models:/app/Agent/knowledge_base/models:ro
      - ./Agent/knowledge_base/db:/app/Agent/knowledge_base/db
      - kb_multimodal_indexes:/app/Agent/knowledge_base/multimodal_indexes
    depends_on:
      mysql-primary:
        condition: service_healthy
      mysql-replica:
        condition: service_healthy
      db-bootstrap:
        condition: service_completed_successfully
      causal-mcp:
        condition: service_healthy
      kb-indexes-sync:
        condition: service_completed_successfully
    networks:
      - causalagent_replica_network
    restart: unless-stopped
    stop_grace_period: 75s

  causal-mcp:
    build:
      context: .
      dockerfile: Agent/CausalAgentMCP/Dockerfile
    container_name: causalagent_causal_mcp
    labels:
      causalagent_observability: "true"
      causalagent_service: "mcp"
      causalagent_environment: "development"
    command: python -m Agent.CausalAgentMCP.app
    environment:
      - MYSQL_HOST=mysql-primary
      - MYSQL_WRITE_HOST=mysql-primary
      - MYSQL_READ_HOSTS=
      - MYSQL_PORT=3306
      - MYSQL_USER=${MYSQL_USER}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
      - MYSQL_WRITE_USER=${MYSQL_WRITE_USER:-${MYSQL_USER}}
      - MYSQL_WRITE_PASSWORD=${MYSQL_WRITE_PASSWORD:-${MYSQL_PASSWORD}}
      - MYSQL_READ_USER=${MYSQL_READ_USER:-${MYSQL_USER}}
      - MYSQL_READ_PASSWORD=${MYSQL_READ_PASSWORD:-${MYSQL_PASSWORD}}
      - MYSQL_DATABASE=${MYSQL_DATABASE}
      - MYSQL_POOL_SIZE_WRITE=${MYSQL_POOL_SIZE_WRITE:-2}
      - MYSQL_POOL_SIZE_READ=${MYSQL_POOL_SIZE_READ:-1}
      - MYSQL_CONNECT_TIMEOUT_SECONDS=${MYSQL_CONNECT_TIMEOUT_SECONDS:-5}
      - MYSQL_POOL_ACQUIRE_TIMEOUT_SECONDS=${MYSQL_POOL_ACQUIRE_TIMEOUT_SECONDS:-3}
      - CAUSAL_MCP_SERVICE_TOKEN=${CAUSAL_MCP_SERVICE_TOKEN:-local-causal-mcp-token}
      - CAUSAL_MCP_SIGNING_KEY_CURRENT=${CAUSAL_MCP_SIGNING_KEY_CURRENT:-local-causal-mcp-signing-key}
      - CAUSAL_MCP_SIGNING_KEY_ID=${CAUSAL_MCP_SIGNING_KEY_ID:-current}
      - CAUSAL_MCP_PROCESS_WORKERS=${CAUSAL_MCP_PROCESS_WORKERS:-2}
      - CAUSAL_MCP_QUEUE_CAPACITY=${CAUSAL_MCP_QUEUE_CAPACITY:-4}
      - CAUSAL_MCP_ENQUEUE_TIMEOUT_SECONDS=${CAUSAL_MCP_ENQUEUE_TIMEOUT_SECONDS:-5}
      - CAUSAL_MCP_ALGORITHM_DEADLINE_SECONDS=${CAUSAL_MCP_ALGORITHM_DEADLINE_SECONDS:-600}
      - CAUSAL_MCP_SLOW_LOG_SECONDS=${CAUSAL_MCP_SLOW_LOG_SECONDS:-60}
      - CDFM_MODEL_PATH=${CDFM_MODEL_PATH:-DMIRLAB/CDFM}
    depends_on:
      mysql-primary:
        condition: service_healthy
      db-bootstrap:
        condition: service_completed_successfully
    networks:
      - causalagent_replica_network
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/ready', timeout=2)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped
    stop_grace_period: 75s

  db-bootstrap:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: causalagent_db_bootstrap
    labels:
      causalagent_observability: "true"
      causalagent_service: "maintenance"
      causalagent_environment: "development"
    command: python -m Database.bootstrap
    environment:
      - MYSQL_HOST=mysql-primary
      - MYSQL_WRITE_HOST=mysql-primary
      - MYSQL_PORT=3306
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
      - MYSQL_USER=${MYSQL_USER}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
      - MYSQL_WRITE_USER=${MYSQL_WRITE_USER:-${MYSQL_USER}}
      - MYSQL_WRITE_PASSWORD=${MYSQL_WRITE_PASSWORD:-${MYSQL_PASSWORD}}
      - MYSQL_DATABASE=${MYSQL_DATABASE}
      - CHECKPOINT_POSTGRES_HOST=postgres-checkpoint
      - CHECKPOINT_POSTGRES_PORT=5432
      - CHECKPOINT_POSTGRES_DATABASE=${CHECKPOINT_POSTGRES_DATABASE:-causalagent_checkpoints}
      - CHECKPOINT_POSTGRES_USER=${CHECKPOINT_POSTGRES_USER:-causalagent_checkpoint}
      - CHECKPOINT_POSTGRES_PASSWORD=${CHECKPOINT_POSTGRES_PASSWORD}
      - CHECKPOINT_POSTGRES_CONNECT_TIMEOUT_SECONDS=${CHECKPOINT_POSTGRES_CONNECT_TIMEOUT_SECONDS:-5}
      - CHECKPOINT_POSTGRES_POOL_MIN_SIZE=1
      - CHECKPOINT_POSTGRES_POOL_MAX_SIZE=2
    volumes:
      - .:/app
    depends_on:
      mysql-primary:
        condition: service_healthy
      postgres-checkpoint:
        condition: service_healthy
    networks:
      - causalagent_replica_network

  agent-persistence-cleanup:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: causalagent_agent_persistence_cleanup
    labels:
      causalagent_observability: "true"
      causalagent_service: "maintenance"
      causalagent_environment: "development"
    command: python -m Database.agent_persistence_cleanup_worker
    environment:
      - MYSQL_HOST=mysql-primary
      - MYSQL_WRITE_HOST=mysql-primary
      - MYSQL_READ_HOSTS=mysql-replica
      - MYSQL_PORT=3306
      - MYSQL_USER=${MYSQL_USER}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
      - MYSQL_WRITE_USER=${MYSQL_WRITE_USER:-${MYSQL_USER}}
      - MYSQL_WRITE_PASSWORD=${MYSQL_WRITE_PASSWORD:-${MYSQL_PASSWORD}}
      - MYSQL_READ_USER=${MYSQL_READ_USER:-${MYSQL_USER}}
      - MYSQL_READ_PASSWORD=${MYSQL_READ_PASSWORD:-${MYSQL_PASSWORD}}
      - MYSQL_DATABASE=${MYSQL_DATABASE}
      - MYSQL_POOL_SIZE_WRITE=${MYSQL_POOL_SIZE_WRITE:-3}
      - MYSQL_POOL_SIZE_READ=${MYSQL_POOL_SIZE_READ:-1}
      - MYSQL_CONNECT_TIMEOUT_SECONDS=${MYSQL_CONNECT_TIMEOUT_SECONDS:-5}
      - MYSQL_POOL_ACQUIRE_TIMEOUT_SECONDS=${MYSQL_POOL_ACQUIRE_TIMEOUT_SECONDS:-3}
      - MYSQL_POOL_ACQUIRE_RETRY_MS=${MYSQL_POOL_ACQUIRE_RETRY_MS:-50}
      - CHECKPOINT_POSTGRES_HOST=postgres-checkpoint
      - CHECKPOINT_POSTGRES_PORT=5432
      - CHECKPOINT_POSTGRES_DATABASE=${CHECKPOINT_POSTGRES_DATABASE:-causalagent_checkpoints}
      - CHECKPOINT_POSTGRES_USER=${CHECKPOINT_POSTGRES_USER:-causalagent_checkpoint}
      - CHECKPOINT_POSTGRES_PASSWORD=${CHECKPOINT_POSTGRES_PASSWORD}
      - CHECKPOINT_POSTGRES_CONNECT_TIMEOUT_SECONDS=${CHECKPOINT_POSTGRES_CONNECT_TIMEOUT_SECONDS:-5}
      - CHECKPOINT_POSTGRES_POOL_MIN_SIZE=1
      - CHECKPOINT_POSTGRES_POOL_MAX_SIZE=2
      - AGENT_PERSISTENCE_CLEANUP_POLL_INTERVAL_SECONDS=${AGENT_PERSISTENCE_CLEANUP_POLL_INTERVAL_SECONDS:-1}
      - AGENT_PERSISTENCE_CLEANUP_HEARTBEAT_INTERVAL_SECONDS=${AGENT_PERSISTENCE_CLEANUP_HEARTBEAT_INTERVAL_SECONDS:-10}
      - AGENT_PERSISTENCE_CLEANUP_LEASE_SECONDS=${AGENT_PERSISTENCE_CLEANUP_LEASE_SECONDS:-300}
      - API_KEY=${API_KEY}
      - BASE_URL=${BASE_URL}
      - MODEL=${MODEL}
      - SECRET_KEY=${SECRET_KEY}
    volumes:
      - .:/app
    depends_on:
      mysql-primary:
        condition: service_healthy
      mysql-replica:
        condition: service_healthy
      db-bootstrap:
        condition: service_completed_successfully
    networks:
      - causalagent_replica_network
    restart: unless-stopped

  rag-eval-worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: causalchat_rag_eval_worker
    command: python -m app.rag_eval.worker
    env_file:
      - path: .env
        required: false
    environment:
      - MYSQL_HOST=mysql-primary
      - MYSQL_WRITE_HOST=mysql-primary
      - MYSQL_READ_HOSTS=mysql-replica
      - MYSQL_PORT=3306
      - MYSQL_USER=${MYSQL_USER}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
      - MYSQL_WRITE_USER=${MYSQL_WRITE_USER:-${MYSQL_USER}}
      - MYSQL_WRITE_PASSWORD=${MYSQL_WRITE_PASSWORD:-${MYSQL_PASSWORD}}
      - MYSQL_READ_USER=${MYSQL_READ_USER:-${MYSQL_USER}}
      - MYSQL_READ_PASSWORD=${MYSQL_READ_PASSWORD:-${MYSQL_PASSWORD}}
      - MYSQL_REPLICA_STATUS_USER=${MYSQL_REPLICA_STATUS_USER:-}
      - MYSQL_REPLICA_STATUS_PASSWORD=${MYSQL_REPLICA_STATUS_PASSWORD:-}
      - MYSQL_DATABASE=${MYSQL_DATABASE}
      - MYSQL_POOL_SIZE_WRITE=${MYSQL_POOL_SIZE_WRITE:-5}
      - MYSQL_POOL_SIZE_READ=${MYSQL_POOL_SIZE_READ:-5}
      - MYSQL_REPLICA_MAX_LAG_SECONDS=${MYSQL_REPLICA_MAX_LAG_SECONDS:-2}
      - MYSQL_QUERY_WARN_MS=${MYSQL_QUERY_WARN_MS:-500}
      - RAG_EVAL_ROOT=/app/tmp/rag_eval
      - RAG_EVAL_DATASET_ROOT=/app/tmp/rag_eval/datasets/registered
      - RAG_EVAL_EVALUATION_WORKERS=${RAG_EVAL_EVALUATION_WORKERS:-5}
      - RAG_EVAL_INGESTION_CONCURRENCY_LIMIT=${RAG_EVAL_INGESTION_CONCURRENCY_LIMIT:-1}
      - RAG_EVAL_CANDIDATE_GENERATION_CONCURRENCY_LIMIT=${RAG_EVAL_CANDIDATE_GENERATION_CONCURRENCY_LIMIT:-1}
      - RAG_EVAL_TUNING_DATASET_GOVERNANCE_CONCURRENCY_LIMIT=${RAG_EVAL_TUNING_DATASET_GOVERNANCE_CONCURRENCY_LIMIT:-1}
      - RAG_EVAL_DATASET_GOVERNANCE_CONCURRENCY_LIMIT=${RAG_EVAL_DATASET_GOVERNANCE_CONCURRENCY_LIMIT:-1}
      - RAG_EVAL_EVALUATION_CONCURRENCY_LIMIT=${RAG_EVAL_EVALUATION_CONCURRENCY_LIMIT:-3}
      - RAG_EVAL_RAG_QUERY_CONCURRENCY_LIMIT=${RAG_EVAL_RAG_QUERY_CONCURRENCY_LIMIT:-2}
      - RAG_EVAL_EVALUATION_POLL_INTERVAL_SECONDS=${RAG_EVAL_EVALUATION_POLL_INTERVAL_SECONDS:-1}
      - RAG_EVAL_EVALUATION_HEARTBEAT_INTERVAL_SECONDS=${RAG_EVAL_EVALUATION_HEARTBEAT_INTERVAL_SECONDS:-10}
      - RAG_EVAL_EVALUATION_JOB_STALE_AFTER_SECONDS=${RAG_EVAL_EVALUATION_JOB_STALE_AFTER_SECONDS:-120}
      - RAG_EVAL_EVALUATION_STALE_AFTER_SECONDS=${RAG_EVAL_EVALUATION_STALE_AFTER_SECONDS:-1800}
      - API_KEY=${API_KEY}
      - BASE_URL=${BASE_URL}
      - MODEL=${MODEL}
      - EMBEDDING_API_KEY=${EMBEDDING_API_KEY:-}
      - EMBEDDING_BASE_URL=${EMBEDDING_BASE_URL:-}
      - EMBEDDING_MODEL=${EMBEDDING_MODEL:-qwen3.7-text-embedding}
      - SECRET_KEY=${SECRET_KEY}
      - FLASK_ENV=development
      - MULTIMODAL_DOCLING_ARTIFACTS_DIR=/app/Agent/knowledge_base/models/docling
      - LANGCHAIN_API_KEY=${LANGCHAIN_API_KEY:-}
      - LANGCHAIN_PROJECT=${LANGCHAIN_PROJECT:-}
    volumes:
      - .:/app
      - /app/__pycache__
      - /app/杂项
      - ./Agent/knowledge_base/models:/app/Agent/knowledge_base/models:ro
      - ./Agent/knowledge_base/db:/app/Agent/knowledge_base/db
      - kb_multimodal_indexes:/app/Agent/knowledge_base/multimodal_indexes
      - ./tmp/rag_eval:/app/tmp/rag_eval
    depends_on:
      mysql-primary:
        condition: service_healthy
      mysql-replica:
        condition: service_healthy
      db-bootstrap:
        condition: service_completed_successfully
      kb-indexes-sync:
        condition: service_completed_successfully
    networks:
      - causalagent_replica_network
    restart: unless-stopped

  monitor:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: causalagent_monitor
    labels:
      causalagent_observability: "true"
      causalagent_service: "monitor"
      causalagent_environment: "development"
    command: python -m Database.monitor_worker
    environment:
      - MYSQL_HOST=mysql-primary
      - MYSQL_WRITE_HOST=mysql-primary
      - MYSQL_READ_HOSTS=mysql-replica
      - MYSQL_PORT=3306
      - MYSQL_USER=${MYSQL_USER}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
      - MYSQL_WRITE_USER=${MYSQL_WRITE_USER:-${MYSQL_USER}}
      - MYSQL_WRITE_PASSWORD=${MYSQL_WRITE_PASSWORD:-${MYSQL_PASSWORD}}
      - MYSQL_READ_USER=${MYSQL_READ_USER:-${MYSQL_USER}}
      - MYSQL_READ_PASSWORD=${MYSQL_READ_PASSWORD:-${MYSQL_PASSWORD}}
      - MYSQL_REPLICA_STATUS_USER=${MYSQL_REPLICA_STATUS_USER:-}
      - MYSQL_REPLICA_STATUS_PASSWORD=${MYSQL_REPLICA_STATUS_PASSWORD:-}
      - MYSQL_DATABASE=${MYSQL_DATABASE}
      - MYSQL_POOL_SIZE_WRITE=${MYSQL_POOL_SIZE_WRITE:-5}
      - MYSQL_POOL_SIZE_READ=${MYSQL_POOL_SIZE_READ:-5}
      - MYSQL_CONNECT_TIMEOUT_SECONDS=${MYSQL_CONNECT_TIMEOUT_SECONDS:-5}
      - MYSQL_POOL_ACQUIRE_TIMEOUT_SECONDS=${MYSQL_POOL_ACQUIRE_TIMEOUT_SECONDS:-3}
      - MYSQL_POOL_ACQUIRE_RETRY_MS=${MYSQL_POOL_ACQUIRE_RETRY_MS:-50}
      - MYSQL_REPLICA_MAX_LAG_SECONDS=${MYSQL_REPLICA_MAX_LAG_SECONDS:-2}
      - MYSQL_REPLICA_STATUS_CACHE_SECONDS=${MYSQL_REPLICA_STATUS_CACHE_SECONDS:-2}
      - MYSQL_QUERY_WARN_MS=${MYSQL_QUERY_WARN_MS:-500}
      - CHECKPOINT_POSTGRES_HOST=postgres-checkpoint
      - CHECKPOINT_POSTGRES_PORT=5432
      - CHECKPOINT_POSTGRES_DATABASE=${CHECKPOINT_POSTGRES_DATABASE:-causalagent_checkpoints}
      - CHECKPOINT_POSTGRES_USER=${CHECKPOINT_POSTGRES_USER:-causalagent_checkpoint}
      - CHECKPOINT_POSTGRES_PASSWORD=${CHECKPOINT_POSTGRES_PASSWORD}
      - CHECKPOINT_POSTGRES_CONNECT_TIMEOUT_SECONDS=${CHECKPOINT_POSTGRES_CONNECT_TIMEOUT_SECONDS:-5}
      - JOB_STALE_AFTER_SECONDS=${JOB_STALE_AFTER_SECONDS:-120}
      - DB_INSPECTION_QUERY_TIMEOUT_MS=${DB_INSPECTION_QUERY_TIMEOUT_MS:-3000}
      - DB_DASHBOARD_CONNECTION_WARNING_PERCENT=${DB_DASHBOARD_CONNECTION_WARNING_PERCENT:-70}
      - DB_DASHBOARD_CONNECTION_CRITICAL_PERCENT=${DB_DASHBOARD_CONNECTION_CRITICAL_PERCENT:-85}
      - DB_MONITOR_AUTO_REFRESH_ENABLED=${DB_MONITOR_AUTO_REFRESH_ENABLED:-true}
      - DB_MONITOR_REALTIME_INTERVAL_SECONDS=${DB_MONITOR_REALTIME_INTERVAL_SECONDS:-10}
      - DB_MONITOR_SQL_INTERVAL_SECONDS=${DB_MONITOR_SQL_INTERVAL_SECONDS:-60}
      - DB_MONITOR_TABLE_CAPACITY_INTERVAL_SECONDS=${DB_MONITOR_TABLE_CAPACITY_INTERVAL_SECONDS:-900}
      - DB_MONITOR_SLOW_QUERY_WARNING_DELTA=${DB_MONITOR_SLOW_QUERY_WARNING_DELTA:-1}
      - DB_MONITOR_INTEGRITY_ENABLED=${DB_MONITOR_INTEGRITY_ENABLED:-false}
      - DB_MONITOR_INTEGRITY_INTERVAL_SECONDS=${DB_MONITOR_INTEGRITY_INTERVAL_SECONDS:-86400}
      - API_KEY=${API_KEY}
      - BASE_URL=${BASE_URL}
      - MODEL=${MODEL}
      - SECRET_KEY=${SECRET_KEY}
      - FLASK_ENV=development
      - LANGCHAIN_API_KEY=${LANGCHAIN_API_KEY:-}
      - LANGCHAIN_PROJECT=${LANGCHAIN_PROJECT:-}
    volumes:
      - .:/app
      - /app/__pycache__
      - /app/杂项
    depends_on:
      mysql-primary:
        condition: service_healthy
      mysql-replica:
        condition: service_healthy
      db-bootstrap:
        condition: service_completed_successfully
    networks:
      - causalagent_replica_network
    restart: unless-stopped

  searxng:
    image: searxng/searxng:2026.8.21-bbb3c7d82
    container_name: causalagent_searxng
    restart: unless-stopped
    environment:
      - SEARXNG_BASE_URL=http://searxng:8080/
      - SEARXNG_SECRET=${SEARXNG_SECRET:-local-searxng-secret}
    volumes:
      - ./searxng/core-config:/etc/searxng:ro
      - searxng_core_data:/var/cache/searxng
    depends_on:
      valkey:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - /usr/local/searxng/.venv/bin/python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=2)
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s
    networks:
      - causalagent_replica_network

  valkey:
    image: valkey/valkey:9-alpine
    container_name: causalagent_valkey
    command: valkey-server --save 30 1 --loglevel warning
    restart: unless-stopped
    volumes:
      - searxng_valkey_data:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - causalagent_replica_network

  loki:
    image: grafana/loki:3.7.4
    container_name: causalagent_loki
    command: -config.file=/etc/loki/config.yml
    volumes:
      - ./observability/loki/loki-config.yml:/etc/loki/config.yml:ro
      - loki_data:/loki
    networks:
      - observability_network
    cpus: "1.0"
    mem_limit: 1g
    restart: unless-stopped

  alloy:
    image: grafana/alloy:v1.18.0
    container_name: causalagent_alloy
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - --disable-reporting
      - /etc/alloy/config.alloy
    volumes:
      - ./observability/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - alloy_positions:/var/lib/alloy/data
    networks:
      - observability_network
    depends_on:
      loki:
        condition: service_started
    cpus: "0.5"
    mem_limit: 256m
    restart: unless-stopped

  grafana:
    image: grafana/grafana:13.1.1
    container_name: causalagent_grafana
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD must be set}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_USERS_DEFAULT_LANGUAGE: zh-Hans
      GF_SERVER_ROOT_URL: /grafana/
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    networks:
      - observability_network
    depends_on:
      loki:
        condition: service_started
    cpus: "0.5"
    mem_limit: 512m
    restart: unless-stopped

  kb-indexes-sync:
    image: python:3.11-slim
    container_name: causalagent_kb_indexes_sync
    volumes:
      - .:/src:ro
      - kb_multimodal_indexes:/app/Agent/knowledge_base/multimodal_indexes
    command:
      - sh
      - -c
      - cp -a /src/Agent/knowledge_base/multimodal_indexes/. /app/Agent/knowledge_base/multimodal_indexes/
    networks:
      - causalagent_replica_network

networks:
  causalagent_replica_network:
    driver: bridge
  observability_network:
    driver: bridge

volumes:
  mysql_primary_data:
    driver: local
  mysql_replica_data:
    driver: local
  postgres_checkpoint_data:
    driver: local
  searxng_core_data:
    driver: local
  searxng_valkey_data:
    driver: local
  loki_data:
    driver: local
  grafana_data:
    driver: local
  alloy_positions:
    driver: local
  kb_multimodal_indexes:
    driver: local
