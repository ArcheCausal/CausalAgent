worker_processes auto;
pid /tmp/nginx.pid;

events { worker_connections 1024; }

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log off;
    error_log /var/log/nginx/error.log error;

    # 与 app/request_context.py 的 REQUEST_ID_PATTERN 保持完全一致：
    # 凡应用层会沿用的 ID 网关一律放行转发，避免两端各自重生导致日志关联断裂。
    # 字符集不含空白/引号/反斜杠，escape=json 下注入面可控。
    map $http_x_request_id $request_id_from_gateway {
        "~^[A-Za-z0-9._:-]{1,64}$" $http_x_request_id;
        default $request_id;
    }
    # Grafana Live 的 WebSocket 升级：仅在有 Upgrade 首部时转发，其余保持连接复用。
    map $http_upgrade $connection_upgrade {
        default upgrade;
        "" close;
    }
    # 后端 _deprecated_run_response 覆盖的六个 run 兼容端点族；
    # 仅用于把已带 Deprecation 头的响应归一化为无 ID 的家族标签。
    # 注意：candidate-runs 家族必须放在 rebound-import 精确条目之后，
    # 否则重绑导入会被误标为参数化 run 路由。
    map $uri $deprecated_route {
        default "";
        ~^/api/rag_eval/isolated/ingestion-runs/ "/api/rag_eval/isolated/ingestion-runs/*";
        ~^/api/rag_eval/isolated/tuning-dataset-runs/ "/api/rag_eval/isolated/tuning-dataset-runs/*";
        ~^/api/rag_eval/gold-v2/governance-runs/ "/api/rag_eval/gold-v2/governance-runs/*";
        ~^/api/rag_eval/isolated/rag-runs/ "/api/rag_eval/isolated/rag-runs/*";
        ~^/api/rag_eval/isolated/evaluation-runs/ "/api/rag_eval/isolated/evaluation-runs/*";
        ~^/api/rag_eval/isolated/candidate-runs/rebound-import$ "/api/rag_eval/isolated/candidate-runs/rebound-import";
        ~^/api/rag_eval/isolated/candidate-runs/ "/api/rag_eval/isolated/candidate-runs/*";
    }
    # 弃用观察候选的显式路由标签（Runbook 45 天规则的对象）。
    # 后端尚未对这些路由返回 Deprecation 头（status/steps/config/publish 无
    # successor，rebound-import 待产品确认），因此由网关按 URI 直接记录流量，
    # 零日志才具有“零访问”证据效力。
    map $uri $observed_candidate_route {
        default "";
        ~^/api/rag_eval/status$ "/api/rag_eval/status";
        ~^/api/rag_eval/steps$ "/api/rag_eval/steps";
        ~^/api/rag_eval/config$ "/api/rag_eval/config";
        ~^/api/rag_eval/production-config/publish$ "/api/rag_eval/production-config/publish";
        ~^/api/rag_eval/isolated/candidate-runs/rebound-import$ "/api/rag_eval/isolated/candidate-runs/rebound-import";
    }
    map $observed_candidate_route $deprecated_route_observed {
        default 1;
        "" 0;
    }
    map $upstream_http_deprecation $deprecated_response {
        default 1;
        "" 0;
    }
    # 上游带 Deprecation 头，或命中观察候选路由时写 JSONL；两者皆否则关闭。
    map "$deprecated_response:$deprecated_route_observed" $deprecation_log_enabled {
        default 1;
        "0:0" 0;
    }
    # route 字段优先取家族标签，其次取观察候选字面量，二者皆空说明出现
    # 未映射的新弃用端点，固定记为 unmapped 以便采集侧告警漂移。
    map "$deprecated_route:$observed_candidate_route" $logged_deprecation_route {
        default "unmapped";
        "~^(?<dep_family>[^:]+):" $dep_family;
        "~^:(?<candidate_route>.+)$" $candidate_route;
    }
    log_format deprecation_json escape=json '{"timestamp":"$time_iso8601","request_id":"$request_id_from_gateway","method":"$request_method","route":"$logged_deprecation_route","deprecation":"$upstream_http_deprecation","status":$status}';

    server {
        listen 8080;
        server_name _;
        server_tokens off;
        client_max_body_size 20m;
        access_log /var/log/nginx/deprecation.jsonl deprecation_json if=$deprecation_log_enabled;

        # Grafana 复用同一网关入口：Grafana 自身以 /grafana/ 为 root_url，
        # 这里保持完整 URI 透传，不重写路径。
        # 注意：这是明文 HTTP 入口，仅用于测试服务器；管理员凭据会以明文传输。
        location ^~ /grafana/ {
            proxy_pass http://grafana:3000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            # Grafana Live 使用 WebSocket；保留 Upgrade/Connection 由上游协商。
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 300s;
        }

        location / {
            proxy_pass http://app:5001;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Request-ID $request_id_from_gateway;
            # 隔离 run 的 SSE 在长静默阶段可能超过默认 60s 无读事件；
            # 缓冲已由后端 X-Accel-Buffering: no 关闭，此处只需放宽读超时。
            proxy_read_timeout 300s;
            proxy_set_header Connection "";
        }
    }
}
