# CausalAgent 按需单元测试环境

services:
  unit-test:
    build:
      context: .
      dockerfile: Dockerfile
      target: test
    command: ["python", "-m", "pytest", "-p", "no:cacheprovider", "tests/unit"]
    env_file:
      - ./tests/unit-test-env
    environment:
      # 单元测试与部署使用同一个密钥文件入口；文件随仓库只读挂载。
      CAUSALAGENT_SECRET_FILE: /app/tests/unit-test-secrets.env
      LANGCHAIN_API_KEY: ""
      LANGCHAIN_TRACING_V2: "false"
      LANGSMITH_TRACING: "false"
      PYTHONDONTWRITEBYTECODE: "1"
    network_mode: none
    volumes:
      - type: bind
        source: .
        target: /app
        read_only: true
