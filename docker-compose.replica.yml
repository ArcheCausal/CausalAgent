      - MYSQL_REPLICA_STATUS_USER=${MYSQL_REPLICA_STATUS_USER:-}
      - MYSQL_REPLICA_STATUS_PASSWORD=${MYSQL_REPLICA_STATUS_PASSWORD:-}
      - MYSQL_DATABASE=${MYSQL_DATABASE}
      - MYSQL_POOL_SIZE_WRITE=${MYSQL_POOL_SIZE_WRITE:-5}
      - MYSQL_POOL_SIZE_READ=${MYSQL_POOL_SIZE_READ:-5}
      - MYSQL_CONNECT_TIMEOUT_SECONDS=${MYSQL_CONNECT_TIMEOUT_SECONDS:-5}
      - MYSQL_POOL_ACQUIRE_TIMEOUT_SECONDS=${MYSQL_POOL_ACQUIRE_TIMEOUT_SECONDS:-3}
      - MYSQL_POOL_ACQUIRE_RETRY_MS=${MYSQL_POOL_ACQUIRE_RETRY_MS:-50}
      - MYSQL_REPLICA_MAX_LAG_SECONDS=${MYSQL_REPLICA_MAX_LAG_SECONDS:-2}
      - MYSQL_REPLICA_STATUS_CACHE_SECONDS=${MYSQL_REPLICA_STATUS_CACHE_SECONDS:-2}
      - MYSQL_QUERY_WARN_MS=${MYSQL_QUERY_WARN_MS:-500}
      - JOB_STALE_AFTER_SECONDS=${JOB_STALE_AFTER_SECONDS:-120}
      - DB_INSPECTION_QUERY_TIMEOUT_MS=${DB_INSPECTION_QUERY_TIMEOUT_MS:-3000}
      - DB_DASHBOARD_CONNECTION_WARNING_PERCENT=${DB_DASHBOARD_CONNECTION_WARNING_PERCENT:-70}
      - DB_DASHBOARD_CONNECTION_CRITICAL_PERCENT=${DB_DASHBOARD_CONNECTION_CRITICAL_PERCENT:-85}
      - DB_MONITOR_AUTO_REFRESH_ENABLED=${DB_MONITOR_AUTO_REFRESH_ENABLED:-true}
