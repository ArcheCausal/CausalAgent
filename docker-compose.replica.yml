      - LANGCHAIN_PROJECT=${LANGCHAIN_PROJECT:-}
    volumes:
      - .:/app
      - /app/__pycache__
      - /app/杂项
    depends_on:
      mysql-primary:
        condition: service_healthy
      mysql-replica:
        condition: service_healthy
      db-bootstrap:
        condition: service_completed_successfully
    networks:
      - causalagent_replica_network
    restart: unless-stopped

  rag-eval-worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: causalchat_rag_eval_worker
    command: python -m app.rag_eval.worker
    env_file:
      - path: .env
        required: false
    environment:
      - MYSQL_HOST=mysql-primary
      - MYSQL_WRITE_HOST=mysql-primary
      - MYSQL_READ_HOSTS=mysql-replica
      - MYSQL_PORT=3306
      - MYSQL_USER=${MYSQL_USER}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
      - MYSQL_WRITE_USER=${MYSQL_WRITE_USER:-${MYSQL_USER}}
      - MYSQL_WRITE_PASSWORD=${MYSQL_WRITE_PASSWORD:-${MYSQL_PASSWORD}}
