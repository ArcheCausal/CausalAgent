# ==========================================
# CausalAgent Docker Compose 配置文件（生产环境）
# ==========================================
# 目的：用于生产部署的配置
# 与开发环境的主要区别：
#   1. 不挂载源代码（代码在镜像内）
#   2. 启用自动重启
#   3. 配置日志管理
#   4. 不暴露MySQL端口（安全性）
#   5. 使用构建好的镜像标签

services:

  # --- MySQL 数据库服务（生产配置）---
  mysql:
    image: mysql:8.0
    container_name: causalagent_mysql_prod
    
    # 原因：添加_prod后缀，区分开发和生产容器
    
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    
    # 注意：生产环境应该使用更强的密码
    # 可以考虑使用Docker secrets而不是环境变量（更安全）
    
    # === 关键区别1：不暴露端口 ===
    # ports:
    #   - "3306:3306"  # 注释掉！
    
    # 原因：
    # - 生产环境不应该让外部直接访问数据库
    # - 只有app容器需要访问MySQL
    # - 同一网络内的容器无需端口映射就能通信
    # - 提高安全性，防止未授权访问
    # - 如果需要管理数据库，通过堡垒机或VPN
    
    volumes:
      - mysql_data_prod:/var/lib/mysql
    
    # 原因：使用独立的生产数据卷
    # - 与开发环境数据隔离
    # - 防止误操作删除生产数据
    
    networks:
      - causalagent_network_prod
    
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=\"$$MYSQL_ROOT_PASSWORD\" mysqladmin ping --protocol=tcp -h 127.0.0.1 -P 3306 -u root"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    
    # === 关键区别2：自动重启策略 ===
    restart: unless-stopped
    
    # 原因：
    # - 确保服务意外退出时自动恢复
    # - unless-stopped：重启服务器后自动启动
    # - 除非手动执行 docker-compose down
    
    # === 关键区别3：日志管理 ===
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    
    # 原因解释（防止日志占满磁盘）：
    # - driver: json-file 是默认日志驱动
    # - max-size: "10m" 单个日志文件最大10MB
    # - max-file: "3" 最多保留3个日志文件
    # - 总日志大小：10MB × 3 = 30MB
    # - 超过限制会自动轮转（删除最旧的）
    # - 如果不限制，日志可能增长到几GB
    # 生产环境可以考虑更高级的日志方案：
    # - driver: "syslog" 发送到syslog服务器
    # - driver: "fluentd" 集中式日志收集
    # - driver: "awslogs" 如果在AWS上部署

  # --- LangGraph checkpoint PostgreSQL（生产配置）---
  postgres-checkpoint:
    image: postgres:16-alpine
    container_name: causalagent_postgres_checkpoint_prod
    environment:
      POSTGRES_DB: ${CHECKPOINT_POSTGRES_DATABASE:-causalagent_checkpoints}
      POSTGRES_USER: ${CHECKPOINT_POSTGRES_USER:-causalagent_checkpoint}
      POSTGRES_PASSWORD: ${CHECKPOINT_POSTGRES_PASSWORD:?CHECKPOINT_POSTGRES_PASSWORD must be set}
    volumes:
      - postgres_checkpoint_data_prod:/var/lib/postgresql/data
    networks:
      - causalagent_network_prod
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  causal-mcp:
    image: ${CAUSAL_MCP_IMAGE:?CAUSAL_MCP_IMAGE must be an immutable image digest}
    container_name: causalagent_causal_mcp_prod
    command: python -m Agent.CausalAgentMCP.app
    environment:
      - MYSQL_HOST=mysql
      - MYSQL_WRITE_HOST=mysql
      - MYSQL_READ_HOSTS=
      - MYSQL_PORT=3306
      - MYSQL_USER=${MYSQL_USER:?MYSQL_USER is required}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD:?MYSQL_PASSWORD is required}
      - MYSQL_WRITE_USER=${MYSQL_WRITE_USER:-${MYSQL_USER}}
      - MYSQL_WRITE_PASSWORD=${MYSQL_WRITE_PASSWORD:-${MYSQL_PASSWORD}}
      - MYSQL_READ_USER=${MYSQL_READ_USER:-${MYSQL_USER}}
      - MYSQL_READ_PASSWORD=${MYSQL_READ_PASSWORD:-${MYSQL_PASSWORD}}
      - MYSQL_DATABASE=${MYSQL_DATABASE:?MYSQL_DATABASE is required}
      - MYSQL_POOL_SIZE_WRITE=${MYSQL_POOL_SIZE_WRITE:-2}
      - MYSQL_POOL_SIZE_READ=${MYSQL_POOL_SIZE_READ:-1}
      - MYSQL_CONNECT_TIMEOUT_SECONDS=${MYSQL_CONNECT_TIMEOUT_SECONDS:-5}
      - MYSQL_POOL_ACQUIRE_TIMEOUT_SECONDS=${MYSQL_POOL_ACQUIRE_TIMEOUT_SECONDS:-3}
      - CAUSAL_MCP_SERVICE_TOKEN=${CAUSAL_MCP_SERVICE_TOKEN:?CAUSAL_MCP_SERVICE_TOKEN is required}
      - CAUSAL_MCP_SIGNING_KEY_CURRENT=${CAUSAL_MCP_SIGNING_KEY_CURRENT:?CAUSAL_MCP_SIGNING_KEY_CURRENT is required}
      - CAUSAL_MCP_SIGNING_KEY_PREVIOUS=${CAUSAL_MCP_SIGNING_KEY_PREVIOUS:-}
      - CAUSAL_MCP_SIGNING_KEY_ID=${CAUSAL_MCP_SIGNING_KEY_ID:-current}
      - CAUSAL_MCP_PROCESS_WORKERS=${CAUSAL_MCP_PROCESS_WORKERS:-2}
      - CAUSAL_MCP_QUEUE_CAPACITY=${CAUSAL_MCP_QUEUE_CAPACITY:-4}
      - CAUSAL_MCP_ENQUEUE_TIMEOUT_SECONDS=${CAUSAL_MCP_ENQUEUE_TIMEOUT_SECONDS:-5}
      - CAUSAL_MCP_ALGORITHM_DEADLINE_SECONDS=${CAUSAL_MCP_ALGORITHM_DEADLINE_SECONDS:-600}
      - CAUSAL_MCP_SLOW_LOG_SECONDS=${CAUSAL_MCP_SLOW_LOG_SECONDS:-60}
      - CDFM_MODEL_PATH=${CDFM_MODEL_PATH:-DMIRLAB/CDFM}
      - OMP_NUM_THREADS=1
      - OPENBLAS_NUM_THREADS=1
      - MKL_NUM_THREADS=1
      - FLASK_ENV=production
    depends_on:
      mysql:
        condition: service_healthy
      db-bootstrap:
        condition: service_completed_successfully
    networks:
      - causalagent_network_prod
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/ready', timeout=2)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped
    stop_grace_period: 75s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # --- Flask 应用服务（生产配置）---
  app:
    # === 关键区别4：使用镜像而非构建 ===
    image: causalagent:latest
    # 原因：
    # - 生产环境应该使用预构建的镜像
    # - 镜像应该在CI/CD中构建并测试
    # - 不在生产服务器上构建（减少依赖，提高安全性）
    # 
    # 替代方案（如果需要在服务器上构建）：
    # build:
    #   context: .
    #   dockerfile: Dockerfile
    # image: causalagent:v1.0.0  # 给构建的镜像打标签
    
    container_name: causalagent_app_prod
    
    environment:
      - MYSQL_HOST=mysql  # 仍然使用服务名
      - MYSQL_USER=${MYSQL_USER}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
      - MYSQL_DATABASE=${MYSQL_DATABASE}
      - MYSQL_POOL_SIZE_WRITE=${MYSQL_POOL_SIZE_WRITE:-5}
      - MYSQL_POOL_SIZE_READ=${MYSQL_POOL_SIZE_READ:-5}
      - MYSQL_CONNECT_TIMEOUT_SECONDS=${MYSQL_CONNECT_TIMEOUT_SECONDS:-5}
      - MYSQL_POOL_ACQUIRE_TIMEOUT_SECONDS=${MYSQL_POOL_ACQUIRE_TIMEOUT_SECONDS:-3}
      - MYSQL_POOL_ACQUIRE_RETRY_MS=${MYSQL_POOL_ACQUIRE_RETRY_MS:-50}
      - MYSQL_REPLICA_STATUS_CACHE_SECONDS=${MYSQL_REPLICA_STATUS_CACHE_SECONDS:-2}
      - ADMIN_BATCH_MAX_TARGETS=${ADMIN_BATCH_MAX_TARGETS:-20}
      - ADMIN_DELETE_MAX_RELATED_ROWS=${ADMIN_DELETE_MAX_RELATED_ROWS:-10000}
      - ADMIN_DB_LOCK_WAIT_TIMEOUT_SECONDS=${ADMIN_DB_LOCK_WAIT_TIMEOUT_SECONDS:-5}
      - CHECKPOINT_POSTGRES_HOST=postgres-checkpoint
      - CHECKPOINT_POSTGRES_PORT=5432
      - CHECKPOINT_POSTGRES_DATABASE=${CHECKPOINT_POSTGRES_DATABASE:-causalagent_checkpoints}
      - CHECKPOINT_POSTGRES_USER=${CHECKPOINT_POSTGRES_USER:-causalagent_checkpoint}
      - CHECKPOINT_POSTGRES_PASSWORD=${CHECKPOINT_POSTGRES_PASSWORD}
      - CHECKPOINT_POSTGRES_CONNECT_TIMEOUT_SECONDS=${CHECKPOINT_POSTGRES_CONNECT_TIMEOUT_SECONDS:-5}
      - CHECKPOINT_POSTGRES_POOL_MIN_SIZE=${CHECKPOINT_POSTGRES_POOL_MIN_SIZE:-1}
      - CHECKPOINT_POSTGRES_POOL_MAX_SIZE=${CHECKPOINT_POSTGRES_POOL_MAX_SIZE:-5}
      - JOB_WORKERS=${JOB_WORKERS:-2}
      - JOB_HEARTBEAT_INTERVAL_SECONDS=${JOB_HEARTBEAT_INTERVAL_SECONDS:-10}
      - JOB_STALE_AFTER_SECONDS=${JOB_STALE_AFTER_SECONDS:-120}
      - JOB_MAX_ATTEMPTS=${JOB_MAX_ATTEMPTS:-3}
      - JOB_CHAT_HISTORY_LIMIT=${JOB_CHAT_HISTORY_LIMIT:-20}
      - API_KEY=${API_KEY}
      - BASE_URL=${BASE_URL}
      - MODEL=${MODEL}
      - EMBEDDING_API_KEY=${EMBEDDING_API_KEY:-}
      - EMBEDDING_BASE_URL=${EMBEDDING_BASE_URL:-}
      - EMBEDDING_MODEL=${EMBEDDING_MODEL:-qwen3.7-text-embedding}
      - SECRET_KEY=${SECRET_KEY}
      - CHAT_FRONTEND_DIST_DIR=${CHAT_FRONTEND_DIST_DIR:-/opt/causalagent-chat}
      - CHAT_VITE_DEV_SERVER_URL=${CHAT_VITE_DEV_SERVER_URL:-}
      - WEBSITE_FRONTEND_DIST_DIR=${WEBSITE_FRONTEND_DIST_DIR:-/opt/causalagent-website}
      - WEBSITE_VITE_DEV_SERVER_URL=${WEBSITE_VITE_DEV_SERVER_URL:-}
      - RAG_EVAL_FRONTEND_DIST_DIR=${RAG_EVAL_FRONTEND_DIST_DIR:-/opt/causalagent-rag-eval}
      - DB_INSPECTION_QUERY_TIMEOUT_MS=${DB_INSPECTION_QUERY_TIMEOUT_MS:-3000}
      - DB_DASHBOARD_CONNECTION_WARNING_PERCENT=${DB_DASHBOARD_CONNECTION_WARNING_PERCENT:-70}
      - DB_DASHBOARD_CONNECTION_CRITICAL_PERCENT=${DB_DASHBOARD_CONNECTION_CRITICAL_PERCENT:-85}
      - DB_MONITOR_AUTO_REFRESH_ENABLED=${DB_MONITOR_AUTO_REFRESH_ENABLED:-true}
      - DB_MONITOR_REALTIME_INTERVAL_SECONDS=${DB_MONITOR_REALTIME_INTERVAL_SECONDS:-10}
      - DB_MONITOR_SQL_INTERVAL_SECONDS=${DB_MONITOR_SQL_INTERVAL_SECONDS:-60}
      - DB_MONITOR_TABLE_CAPACITY_INTERVAL_SECONDS=${DB_MONITOR_TABLE_CAPACITY_INTERVAL_SECONDS:-900}
      - DB_MONITOR_SLOW_QUERY_WARNING_DELTA=${DB_MONITOR_SLOW_QUERY_WARNING_DELTA:-1}
      - DB_MONITOR_INTEGRITY_ENABLED=${DB_MONITOR_INTEGRITY_ENABLED:-false}
      - DB_MONITOR_INTEGRITY_INTERVAL_SECONDS=${DB_MONITOR_INTEGRITY_INTERVAL_SECONDS:-86400}
      - LANGCHAIN_API_KEY=${LANGCHAIN_API_KEY:-}
      - LANGCHAIN_PROJECT=${LANGCHAIN_PROJECT:-}
      
      # === 关键区别5：生产环境变量 ===
      - FLASK_ENV=production
      - RAG_EVAL_ROOT=/app/tmp/rag_eval
      - RAG_EVAL_DATASET_ROOT=/app/tmp/rag_eval/datasets/registered
      
      # 原因：
      # - production模式关闭调试信息
      # - 不会自动重载代码
      # - 错误信息不暴露堆栈（安全性）
      # - 性能优化
    
    ports:
      - "5001:5001"
    
    # 生产环境通常会在前面加Nginx反向代理：
    # 客户端 -> Nginx(:80/:443) -> Flask(:5001)
    # 这样可以：
    # - 处理HTTPS
    # - 负载均衡
    # - 静态文件服务
    # - 防止DDoS
    
    # === 关键区别6：不挂载源代码 ===
    volumes:
      # 注意：不挂载 .:/app
      # 代码已经在构建时COPY到镜像内了
      
      # 只挂载需要持久化的数据
      - ./Agent/knowledge_base/models:/app/Agent/knowledge_base/models:ro
      - ./Agent/knowledge_base/source:/app/Agent/knowledge_base/source:ro
      - ./Agent/knowledge_base/db:/app/Agent/knowledge_base/db
      - kb_multimodal_indexes_prod:/app/Agent/knowledge_base/multimodal_indexes
      - ./Agent/knowledge_base/multimodal_runtime:/app/Agent/knowledge_base/multimodal_runtime:ro
      - ./Agent/knowledge_base/multimodal_assets:/app/Agent/knowledge_base/multimodal_assets:ro
      - ./Agent/knowledge_base/rag/runtime:/app/Agent/knowledge_base/rag/runtime:ro
      - ./app/static/generated_graphs:/app/app/static/generated_graphs
      - app_logs_prod:/app/logs  # 新增：应用日志持久化
      - rag_eval_isolated_runs:/app/tmp/rag_eval/runs                    # 隔离运行目录（与 rag-eval-worker 共享）
      - rag_eval_sources:/app/tmp/rag_eval/sources                       # 知识源目录（与 rag-eval-worker 共享）
      - rag_eval_datasets:/app/tmp/rag_eval/datasets/registered          # 数据集目录（与 rag-eval-worker 共享）
      - rag_eval_artifacts:/app/tmp/rag_eval/artifacts
      - rag_eval_reports:/app/tmp/rag_eval/reports
    
    # 原因：
    # - 代码在镜像内，不依赖宿主机文件系统
    # - 镜像是不可变的（immutable），符合最佳实践
    # - 回滚时只需切换镜像标签
    # - 不会因为误修改文件导致问题
    
    depends_on:
      mysql:
        condition: service_healthy
      postgres-checkpoint:
        condition: service_healthy
      db-bootstrap:
        condition: service_completed_successfully
      kb-indexes-sync:
        condition: service_completed_successfully
    
    networks:
      - causalagent_network_prod
    
    restart: unless-stopped
    
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    
    # === 可选：资源限制 ===
    # 生产环境建议配置资源限制，防止一个服务占用所有资源
    # deploy:
    #   resources:
    #     limits:
    #       cpus: '1.0'        # 最多使用1个CPU核心
    #       memory: 2G         # 最多使用2GB内存
    #     reservations:
    #       cpus: '0.5'        # 保证至少0.5个核心
    #       memory: 1G         # 保证至少1GB内存
    
    # 注意：deploy配置需要Docker Swarm或Kubernetes
    # 如果是单机部署，使用docker run的--cpus和--memory参数

  worker:
    image: causalagent:latest
    container_name: causalagent_worker_prod
    command: python -m app.agent.worker
    environment:
      - MYSQL_HOST=mysql
      - MYSQL_WRITE_HOST=mysql
      - MYSQL_READ_HOSTS=
      - MYSQL_PORT=3306
      - MYSQL_USER=${MYSQL_USER}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
      - MYSQL_WRITE_USER=${MYSQL_WRITE_USER:-${MYSQL_USER}}
      - MYSQL_WRITE_PASSWORD=${MYSQL_WRITE_PASSWORD:-${MYSQL_PASSWORD}}
      - MYSQL_READ_USER=${MYSQL_READ_USER:-${MYSQL_USER}}
      - MYSQL_READ_PASSWORD=${MYSQL_READ_PASSWORD:-${MYSQL_PASSWORD}}
      - MYSQL_DATABASE=${MYSQL_DATABASE}
      - MYSQL_POOL_SIZE_WRITE=${MYSQL_POOL_SIZE_WRITE:-5}
      - MYSQL_POOL_SIZE_READ=${MYSQL_POOL_SIZE_READ:-5}
      - MYSQL_CONNECT_TIMEOUT_SECONDS=${MYSQL_CONNECT_TIMEOUT_SECONDS:-5}
      - MYSQL_POOL_ACQUIRE_TIMEOUT_SECONDS=${MYSQL_POOL_ACQUIRE_TIMEOUT_SECONDS:-3}
      - MYSQL_POOL_ACQUIRE_RETRY_MS=${MYSQL_POOL_ACQUIRE_RETRY_MS:-50}
      - MYSQL_REPLICA_STATUS_CACHE_SECONDS=${MYSQL_REPLICA_STATUS_CACHE_SECONDS:-2}
      - CHECKPOINT_POSTGRES_HOST=postgres-checkpoint
      - CHECKPOINT_POSTGRES_PORT=5432
      - CHECKPOINT_POSTGRES_DATABASE=${CHECKPOINT_POSTGRES_DATABASE:-causalagent_checkpoints}
      - CHECKPOINT_POSTGRES_USER=${CHECKPOINT_POSTGRES_USER:-causalagent_checkpoint}
      - CHECKPOINT_POSTGRES_PASSWORD=${CHECKPOINT_POSTGRES_PASSWORD}
      - CHECKPOINT_POSTGRES_CONNECT_TIMEOUT_SECONDS=${CHECKPOINT_POSTGRES_CONNECT_TIMEOUT_SECONDS:-5}
      - CHECKPOINT_POSTGRES_POOL_MIN_SIZE=${CHECKPOINT_POSTGRES_POOL_MIN_SIZE:-1}
      - CHECKPOINT_POSTGRES_POOL_MAX_SIZE=${CHECKPOINT_POSTGRES_POOL_MAX_SIZE:-5}
      - JOB_WORKERS=${JOB_WORKERS:-2}
      - JOB_HEARTBEAT_INTERVAL_SECONDS=${JOB_HEARTBEAT_INTERVAL_SECONDS:-10}
      - JOB_STALE_AFTER_SECONDS=${JOB_STALE_AFTER_SECONDS:-120}
      - JOB_DRAIN_TIMEOUT_SECONDS=${JOB_DRAIN_TIMEOUT_SECONDS:-60}
      - JOB_MAX_ATTEMPTS=${JOB_MAX_ATTEMPTS:-3}
      - JOB_CHAT_HISTORY_LIMIT=${JOB_CHAT_HISTORY_LIMIT:-20}
      - WEB_SEARCH_PROVIDER=${WEB_SEARCH_PROVIDER:-searxng}
      - SEARXNG_URL=${SEARXNG_URL:-http://searxng:8080}
      - API_KEY=${API_KEY}
      - BASE_URL=${BASE_URL}
      - MODEL=${MODEL}
      - DEEP_AGENT_MODEL=${DEEP_AGENT_MODEL:?DEEP_AGENT_MODEL is required}
      - DEEP_AGENT_BASE_URL=${DEEP_AGENT_BASE_URL:?DEEP_AGENT_BASE_URL is required}
      - DEEP_AGENT_API_KEY=${DEEP_AGENT_API_KEY:?DEEP_AGENT_API_KEY is required}
      - DEEP_AGENT_CONTEXT_WINDOW_TOKENS=${DEEP_AGENT_CONTEXT_WINDOW_TOKENS:?DEEP_AGENT_CONTEXT_WINDOW_TOKENS is required}
      - CAUSAL_MCP_URL=http://causal-mcp:8080/mcp
      - CAUSAL_MCP_SERVICE_TOKEN=${CAUSAL_MCP_SERVICE_TOKEN:?CAUSAL_MCP_SERVICE_TOKEN is required}
      - CAUSAL_MCP_SIGNING_KEY_CURRENT=${CAUSAL_MCP_SIGNING_KEY_CURRENT:?CAUSAL_MCP_SIGNING_KEY_CURRENT is required}
      - CAUSAL_MCP_SIGNING_KEY_ID=${CAUSAL_MCP_SIGNING_KEY_ID:-current}
      - CAUSAL_MCP_CLIENT_POOL_SIZE=${CAUSAL_MCP_CLIENT_POOL_SIZE:-2}
      - CAUSAL_MCP_MAX_IN_FLIGHT_PER_CLIENT=${CAUSAL_MCP_MAX_IN_FLIGHT_PER_CLIENT:-1}
      - CAUSAL_MCP_POOL_ACQUIRE_TIMEOUT_SECONDS=${CAUSAL_MCP_POOL_ACQUIRE_TIMEOUT_SECONDS:-5}
      - CAUSAL_MCP_CONTROL_POOL_SIZE=${CAUSAL_MCP_CONTROL_POOL_SIZE:-1}
      - CAUSAL_MCP_CONTROL_MAX_IN_FLIGHT_PER_CLIENT=${CAUSAL_MCP_CONTROL_MAX_IN_FLIGHT_PER_CLIENT:-2}
      - CAUSAL_MCP_CONTROL_ACQUIRE_TIMEOUT_SECONDS=${CAUSAL_MCP_CONTROL_ACQUIRE_TIMEOUT_SECONDS:-1}
      - CAUSAL_MCP_CANCEL_TIMEOUT_SECONDS=${CAUSAL_MCP_CANCEL_TIMEOUT_SECONDS:-6}
      - CAUSAL_MCP_HTTP_MAX_CONNECTIONS=${CAUSAL_MCP_HTTP_MAX_CONNECTIONS:-8}
      - CAUSAL_MCP_HTTP_MAX_KEEPALIVE_CONNECTIONS=${CAUSAL_MCP_HTTP_MAX_KEEPALIVE_CONNECTIONS:-4}
      - CAUSAL_MCP_HTTP_READ_TIMEOUT_SECONDS=${CAUSAL_MCP_HTTP_READ_TIMEOUT_SECONDS:-660}
      - EMBEDDING_API_KEY=${EMBEDDING_API_KEY:-}
      - EMBEDDING_BASE_URL=${EMBEDDING_BASE_URL:-}
      - EMBEDDING_MODEL=${EMBEDDING_MODEL:-qwen3.7-text-embedding}
      - SECRET_KEY=${SECRET_KEY}
      - FLASK_ENV=production
      - MULTIMODAL_DOCLING_ARTIFACTS_DIR=/app/Agent/knowledge_base/models/docling
      - LANGCHAIN_API_KEY=${LANGCHAIN_API_KEY:-}
      - LANGCHAIN_PROJECT=${LANGCHAIN_PROJECT:-}
    volumes:
      - ./Agent/knowledge_base/models:/app/Agent/knowledge_base/models:ro
      - ./Agent/knowledge_base/source:/app/Agent/knowledge_base/source:ro
      - ./Agent/knowledge_base/db:/app/Agent/knowledge_base/db
      - kb_multimodal_indexes_prod:/app/Agent/knowledge_base/multimodal_indexes
      - ./Agent/knowledge_base/multimodal_runtime:/app/Agent/knowledge_base/multimodal_runtime:ro
      - ./Agent/knowledge_base/multimodal_assets:/app/Agent/knowledge_base/multimodal_assets:ro
      - ./Agent/knowledge_base/rag/runtime:/app/Agent/knowledge_base/rag/runtime:ro
      - app_logs_prod:/app/logs
    depends_on:
      db-bootstrap:
        condition: service_completed_successfully
      causal-mcp:
        condition: service_healthy
      kb-indexes-sync:
        condition: service_completed_successfully
    networks:
      - causalagent_network_prod
    restart: unless-stopped
    stop_grace_period: 75s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  agent-persistence-cleanup:
    image: causalagent:latest
    container_name: causalagent_agent_persistence_cleanup_prod
    command: python -m Database.agent_persistence_cleanup_worker
    environment:
      - MYSQL_HOST=mysql
      - MYSQL_WRITE_HOST=mysql
      - MYSQL_READ_HOSTS=
      - MYSQL_PORT=3306
      - MYSQL_USER=${MYSQL_USER}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
      - MYSQL_WRITE_USER=${MYSQL_WRITE_USER:-${MYSQL_USER}}
      - MYSQL_WRITE_PASSWORD=${MYSQL_WRITE_PASSWORD:-${MYSQL_PASSWORD}}
      - MYSQL_READ_USER=${MYSQL_READ_USER:-${MYSQL_USER}}
      - MYSQL_READ_PASSWORD=${MYSQL_READ_PASSWORD:-${MYSQL_PASSWORD}}
