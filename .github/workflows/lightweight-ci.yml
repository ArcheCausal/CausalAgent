name: CI validation

on:
  pull_request:
    branches:
      - main
      - develop
    types:
      - opened
      - synchronize
      - reopened
      - edited
      - ready_for_review

  push:
    branches:
      - main
      - develop

  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: lightweight-ci-${{ github.workflow }}-${{ github.ref }}
  # Pull Request 的新提交取消同分支旧运行；push 的缓存预热不与后续运行互取消，
  # 否则频繁合并会让预热构建在写入缓存前被中断。
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  detect-changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.event_name == 'pull_request'
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontends: ${{ steps.filter.outputs.frontends }}
      contracts: ${{ steps.filter.outputs.contracts }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Filter changed paths
        id: filter
        uses: dorny/paths-filter@v4
        with:
          filters: .github/filters/paths.yaml

  python-syntax:
    name: Python syntax
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.event_name == 'pull_request'
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Compile Python sources
        run: >-
          python -m compileall -q
          app Agent Database config tests
          CausalAgent.py Run_causal.py

  light-tests:
    name: Light tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.event_name == 'pull_request'
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-base.txt

      - name: Install test runner
        run: >-
          python -m pip install --disable-pip-version-check
          "pytest>=8,<9"
          "pydantic==2.13.5"

      - name: Run dependency-free tests
        run: >-
          python -m pytest --quiet
          tests/unit/agent/test_llm_structured_output_usage.py
          tests/unit/agent/test_llm_structured_output_config.py

  backend-unit-tests:
    name: Backend unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: detect-changes
    if: >-
      github.event_name == 'pull_request' &&
      (needs.detect-changes.outputs.backend == 'true' || github.base_ref == 'main')
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Report runner disk capacity
        run: df -h /

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build the repository unit-test image with layer cache
        run: >-
          docker buildx bake
          -f docker-compose.test.yml
          --set unit-test.cache-from=type=gha,scope=unit-test
          --set unit-test.tags=causalagent-unit-test:latest
          --provenance=false
          --load
          unit-test

      - name: Run all backend unit tests
        run: docker compose -p causalagent -f docker-compose.test.yml run --rm unit-test

  warm-unit-test-cache:
    name: Warm unit-test image cache
    runs-on: ubuntu-latest
    timeout-minutes: 45
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Rebuild unit-test image and export layer cache
        run: >-
          docker buildx bake
          -f docker-compose.test.yml
          --set unit-test.cache-from=type=gha,scope=unit-test
          --set "unit-test.cache-to=type=gha,scope=unit-test,mode=min"
          --set "unit-test.output=type=cacheonly"
          --provenance=false
          unit-test

  frontend-builds:
    name: Frontend checks (${{ matrix.directory }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: detect-changes
    if: >-
      github.event_name == 'pull_request' &&
      (needs.detect-changes.outputs.frontends == 'true' || github.base_ref == 'main')
    strategy:
      fail-fast: false
      matrix:
        include:
          - directory: admin-frontend
            script: npm run check
            playwright: false
            design_system: true
          - directory: chat-frontend
            script: npm run check
            playwright: true
            design_system: false
          - directory: website-frontend
            script: npm run check
            playwright: false
            design_system: false
          - directory: app/rag_eval/frontend
            script: |-
              npm run typecheck
              npm test
              npm run build
            playwright: false
            design_system: true
          - directory: packages/design-system
            script: npm run check
            playwright: false
            design_system: false
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            ${{ matrix.directory }}/package-lock.json
            packages/design-system/package-lock.json

      - name: Install shared design-system dependencies
        if: matrix.design_system
        working-directory: packages/design-system
        run: npm ci

      - name: Install locked dependencies
        working-directory: ${{ matrix.directory }}
        run: npm ci

      - name: Install Chromium for chat Mock E2E
        if: matrix.playwright
        working-directory: ${{ matrix.directory }}
        run: npx playwright install --with-deps chromium

      - name: Run checks and production build
        working-directory: ${{ matrix.directory }}
        run: ${{ matrix.script }}

  staging-compose-contract:
    name: Compose and deployment contracts
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: detect-changes
    if: >-
      github.event_name == 'pull_request' &&
      (needs.detect-changes.outputs.contracts == 'true' || github.base_ref == 'main')
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test runner
        run: python -m pip install --disable-pip-version-check -r requirements-test.txt

      - name: Validate development and staging Compose files
        env:
          CHECKPOINT_POSTGRES_PASSWORD: compose-static-validation
          GRAFANA_ADMIN_PASSWORD: compose-static-validation
        run: |
          docker compose --env-file .env.example -f docker-compose.yml config --quiet
          docker compose --env-file .env.staging.example -f docker-compose.staging.yml config --quiet

      - name: Validate staging deployment and observability contracts
        run: >-
          python -m pytest -p no:cacheprovider
          tests/integration/deployment/test_staging_compose.py
          tests/integration/deployment/test_searxng_compose.py
          tests/integration/test_observability_compose.py
          tests/test_staging_environment_guard.py

      - name: Validate Alloy configuration
        run: >-
          docker run --rm
          -v "$PWD/observability/alloy/config.alloy:/etc/alloy/config.alloy:ro"
          grafana/alloy:v1.18.0
          validate /etc/alloy/config.alloy

  dockerfile-static-checks:
    name: Dockerfile checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: detect-changes
    if: >-
      github.event_name == 'pull_request' &&
      (needs.detect-changes.outputs.backend == 'true' || github.base_ref == 'main')
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Check app, MCP, and MySQL Dockerfiles
        run: |
          docker buildx build --check --file Dockerfile .
          docker buildx build --check --file Agent/CausalAgentMCP/Dockerfile .
          docker buildx build --check --file Database/mysql/Dockerfile.primary Database/mysql
          docker buildx build --check --file Database/mysql/Dockerfile.replica Database/mysql

  pull-request-policy:
    name: Pull request policy
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    env:
      PR_TITLE: ${{ github.event.pull_request.title }}
      BASE_BRANCH: ${{ github.base_ref }}
      HEAD_BRANCH: ${{ github.head_ref }}
    steps:
      - name: Validate pull request title and branch flow
        shell: bash
        run: |
          pattern='^(feat|fix|docs|refactor|test|chore|ci|build|perf|revert)\([a-z0-9][a-z0-9_-]*\):.+$'
          if [[ ! "$PR_TITLE" =~ $pattern ]]; then
            echo "PR title must follow keyword(scope):description."
            echo "Example: ci(actions):add lightweight checks"
            exit 1
          fi

          if [[ "$BASE_BRANCH" == "main" && "$HEAD_BRANCH" != "develop" ]]; then
            echo "Pull requests to main must come from develop."
            exit 1
          fi
