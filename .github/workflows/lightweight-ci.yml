name: CI validation

on:
  pull_request:
    branches:
      - main
      - develop
    types:
      - opened
      - synchronize
      - reopened
      - edited
      - ready_for_review

  push:
    branches:
      - main
      - develop

  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: lightweight-ci-${{ github.workflow }}-${{ github.ref }}
  # Pull Request 的新提交取消同分支旧运行；push 的缓存预热不与后续运行互取消，
  # 否则频繁合并会让预热构建在写入缓存前被中断。
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  detect-changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.event_name == 'pull_request'
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontends: ${{ steps.filter.outputs.frontends }}
      contracts: ${{ steps.filter.outputs.contracts }}
      build: ${{ steps.filter.outputs.build }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Filter changed paths
        id: filter
        uses: dorny/paths-filter@v4
        with:
          filters: .github/filters/paths.yaml

  python-syntax:
    name: Python syntax
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.event_name == 'pull_request'
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Compile Python sources
        run: >-
          python -m compileall -q
          app Agent Database config tests
          CausalAgent.py Run_causal.py

  backend-unit-tests:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: detect-changes
    if: >-
      github.event_name == 'pull_request' &&
      (needs.detect-changes.outputs.backend == 'true' || github.base_ref == 'main')
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Report runner disk capacity
        run: df -h /

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build the repository unit-test image with layer cache
        # Action 可读取 GHA 缓存运行时变量，普通 run 步骤不会自动获得它们。
        uses: docker/bake-action@v6
        env:
          DOCKER_BUILD_RECORD_UPLOAD: "false"
        with:
          files: docker-compose.test.yml
          targets: unit-test
          load: true
          provenance: false
          set: |
            unit-test.cache-from=type=gha,version=2,scope=unit-test
            unit-test.tags=causalagent-unit-test:latest

      - name: Run backend unit and offline integration tests
        run: docker compose -p causalagent -f docker-compose.test.yml run --rm unit-test

  warm-unit-test-cache:
    name: Warm unit-test image cache
    runs-on: ubuntu-latest
    timeout-minutes: 45
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Rebuild unit-test image and export layer cache
        uses: docker/bake-action@v6
        env:
          DOCKER_BUILD_RECORD_UPLOAD: "false"
        with:
          files: docker-compose.test.yml
          targets: unit-test
          provenance: false
          set: |
            unit-test.cache-from=type=gha,version=2,scope=unit-test
            unit-test.cache-to=type=gha,version=2,scope=unit-test,mode=min
            unit-test.output=type=cacheonly

  frontend-builds:
    name: Frontend checks (${{ matrix.directory }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: detect-changes
    if: >-
      github.event_name == 'pull_request' &&
      (needs.detect-changes.outputs.frontends == 'true' || github.base_ref == 'main')
    strategy:
      fail-fast: false
      matrix:
        include:
          - directory: admin-frontend
            script: npm run check
            playwright: false
            design_system: true
          - directory: chat-frontend
            script: npm run check
            playwright: true
            design_system: false
          - directory: website-frontend
            script: npm run check
            playwright: false
            design_system: false
          - directory: app/rag_eval/frontend
            script: |-
              npm run typecheck
              npm test
              npm run build
            playwright: false
            design_system: true
          - directory: packages/design-system
            script: npm run check
            playwright: false
            design_system: false
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            ${{ matrix.directory }}/package-lock.json
            packages/design-system/package-lock.json

      - name: Install shared design-system dependencies
        if: matrix.design_system
        working-directory: packages/design-system
        run: npm ci

      - name: Install locked dependencies
        working-directory: ${{ matrix.directory }}
        run: npm ci

      - name: Install Chromium for chat Mock E2E
        if: matrix.playwright
        working-directory: ${{ matrix.directory }}
        run: npx playwright install --with-deps chromium

      - name: Run checks and production build
        working-directory: ${{ matrix.directory }}
        run: ${{ matrix.script }}

  staging-compose-contract:
    name: Compose and deployment contracts
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: detect-changes
    if: >-
      github.event_name == 'pull_request' &&
      (needs.detect-changes.outputs.contracts == 'true' || github.base_ref == 'main')
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test runner
        run: python -m pip install --disable-pip-version-check -r requirements-test.txt

      - name: Validate development and staging Compose files
        env:
          # Compose 只校验密钥文件的挂载路径；密钥值来自仓库里的测试密钥文件。
          CAUSALAGENT_SECRET_FILE: ./tests/unit-test-secrets.env
        run: |
          docker compose --env-file .env.example -f docker-compose.yml config --quiet
          docker compose --env-file .env.staging.example -f docker-compose.staging.yml config --quiet

      - name: Validate staging deployment and observability contracts
        env:
          # 契约测试只校验密钥文件内容和挂载路径，使用仓库里的测试密钥文件。
          CAUSALAGENT_SECRET_FILE: ./tests/unit-test-secrets.env
        run: >-
          python -m pytest -p no:cacheprovider
          tests/contracts/deployment
          tests/contracts/database
          tests/contracts/observability
          tests/unit/config/test_secret_file.py
          tests/unit/deployment/test_release_bundle.py

      - name: Validate Alloy configuration
        run: >-
          docker run --rm
          -v "$PWD/observability/alloy/config.alloy:/etc/alloy/config.alloy:ro"
          grafana/alloy:v1.18.0
          validate /etc/alloy/config.alloy

  dockerfile-static-checks:
    name: Dockerfile checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: detect-changes
    if: >-
      github.event_name == 'pull_request' &&
      (needs.detect-changes.outputs.build == 'true' || github.base_ref == 'main')
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Check app, MCP, and MySQL Dockerfiles
        run: |
          docker buildx build --check --file Dockerfile .
          docker buildx build --check --file Agent/CausalAgentMCP/Dockerfile .
          docker buildx build --check --file Database/mysql/Dockerfile.primary Database/mysql
          docker buildx build --check --file Database/mysql/Dockerfile.replica Database/mysql

  pull-request-policy:
    name: Pull request policy
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    env:
      PR_TITLE: ${{ github.event.pull_request.title }}
      BASE_BRANCH: ${{ github.base_ref }}
      HEAD_BRANCH: ${{ github.head_ref }}
    steps:
      - name: Validate pull request title and branch flow
        shell: bash
        run: |
          pattern='^(feat|fix|docs|refactor|test|chore|ci|build|perf|revert)\([a-z0-9][a-z0-9_-]*\):.+$'
          if [[ ! "$PR_TITLE" =~ $pattern ]]; then
            echo "PR title must follow keyword(scope):description."
            echo "Example: ci(actions):add lightweight checks"
            exit 1
          fi

          if [[ "$BASE_BRANCH" == "main" && "$HEAD_BRANCH" != "develop" ]]; then
            echo "Pull requests to main must come from develop."
            exit 1
          fi

  ci-result:
    name: CI result
    if: always() && github.event_name == 'pull_request'
    needs:
      - detect-changes
      - python-syntax
      - backend-unit-tests
      - frontend-builds
      - staging-compose-contract
      - dockerfile-static-checks
      - pull-request-policy
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Compare expected and actual job results
        env:
          EVENT_NAME: ${{ github.event_name }}
          DETECT_RESULT: ${{ needs.detect-changes.result }}
          DETECT_BACKEND: ${{ needs.detect-changes.outputs.backend }}
          DETECT_FRONTENDS: ${{ needs.detect-changes.outputs.frontends }}
          DETECT_CONTRACTS: ${{ needs.detect-changes.outputs.contracts }}
          DETECT_BUILD: ${{ needs.detect-changes.outputs.build }}
          BASE_BRANCH: ${{ github.base_ref }}
          SYNTAX_RESULT: ${{ needs.python-syntax.result }}
          BACKEND_RESULT: ${{ needs.backend-unit-tests.result }}
          FRONTENDS_RESULT: ${{ needs.frontend-builds.result }}
          CONTRACTS_RESULT: ${{ needs.staging-compose-contract.result }}
          BUILD_CHECK_RESULT: ${{ needs.dockerfile-static-checks.result }}
          POLICY_RESULT: ${{ needs.pull-request-policy.result }}
        shell: bash
        run: |
          set -u
          failures=()

          require_success() {
            local name="$1" expected="$2" actual="$3"
            if [[ "$expected" == "true" ]]; then
              if [[ "$actual" != "success" ]]; then
                failures+=("$name 应执行且通过，实际为 $actual")
              fi
            elif [[ "$actual" != "skipped" ]]; then
              failures+=("$name 应跳过，实际为 $actual")
            fi
          }

          if [[ "$EVENT_NAME" != "pull_request" ]]; then
            echo "::error::CI result 只应在 Pull Request 上运行。"
            exit 1
          fi
          if [[ "$DETECT_RESULT" != "success" ]]; then
            echo "::error::路径判断失败（$DETECT_RESULT），不能解释为没有相关变更。"
            exit 1
          fi

          for value in "$DETECT_BACKEND" "$DETECT_FRONTENDS" "$DETECT_CONTRACTS" "$DETECT_BUILD"; do
            if [[ "$value" != "true" && "$value" != "false" ]]; then
              echo "::error::路径判断结果不是 true/false：$value"
              exit 1
            fi
          done

          if [[ "$SYNTAX_RESULT" != "success" ]]; then
            failures+=("Python syntax 应执行且通过，实际为 $SYNTAX_RESULT")
          fi
          if [[ "$POLICY_RESULT" != "success" ]]; then
            failures+=("Pull request policy 应执行且通过，实际为 $POLICY_RESULT")
          fi

          # 面向 main 的 Pull Request 忽略路径结果，常规组都必须执行且通过。
          if [[ "$BASE_BRANCH" == "main" ]]; then
            require_success "Backend tests" "true" "$BACKEND_RESULT"
            require_success "Frontend checks" "true" "$FRONTENDS_RESULT"
            require_success "Compose and deployment contracts" "true" "$CONTRACTS_RESULT"
            require_success "Dockerfile checks" "true" "$BUILD_CHECK_RESULT"
          else
            require_success "Backend tests" "$DETECT_BACKEND" "$BACKEND_RESULT"
            require_success "Frontend checks" "$DETECT_FRONTENDS" "$FRONTENDS_RESULT"
            require_success "Compose and deployment contracts" "$DETECT_CONTRACTS" "$CONTRACTS_RESULT"
            require_success "Dockerfile checks" "$DETECT_BUILD" "$BUILD_CHECK_RESULT"
          fi

          if [[ ${#failures[@]} -gt 0 ]]; then
            for message in "${failures[@]}"; do
              echo "::error::$message"
            done
            exit 1
          fi

          echo "### CI 汇总" >> "$GITHUB_STEP_SUMMARY"
          echo "| 执行组 | 路径命中 | 实际结果 |" >> "$GITHUB_STEP_SUMMARY"
          echo "| --- | --- | --- |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Backend tests | $DETECT_BACKEND | $BACKEND_RESULT |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Frontend checks | $DETECT_FRONTENDS | $FRONTENDS_RESULT |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Contracts | $DETECT_CONTRACTS | $CONTRACTS_RESULT |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Dockerfile checks | $DETECT_BUILD | $BUILD_CHECK_RESULT |" >> "$GITHUB_STEP_SUMMARY"
