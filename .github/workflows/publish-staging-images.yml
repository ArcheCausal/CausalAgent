name: Publish staging images

on:
  workflow_dispatch:
    inputs:
      sandbox_image:
        description: "已发布的数据处理镜像完整引用（必须带 @sha256:digest）"
        required: true

permissions:
  contents: read
  packages: write
  actions: read

concurrency:
  group: staging-images-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-source-ref:
    name: Require develop branch
    runs-on: ubuntu-latest
    steps:
      - name: Reject any ref other than develop
        env:
          SANDBOX_IMAGE: ${{ inputs.sandbox_image }}
        run: |
          if [[ "$GITHUB_REF" != "refs/heads/develop" ]]; then
            echo "::error::Staging images may only be published from the develop branch."
            exit 1
          fi
          if [[ ! "$SANDBOX_IMAGE" =~ ^[A-Za-z0-9][A-Za-z0-9._:/-]*@sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::sandbox_image must be a published SHA-256 image reference."
            exit 1
          fi

  prepare:
    name: Resolve image tags
    runs-on: ubuntu-latest
    needs: validate-source-ref
    outputs:
      owner: ${{ steps.tags.outputs.owner }}
      short_sha: ${{ steps.tags.outputs.short_sha }}
    steps:
      - name: Create lowercase GHCR owner and commit tag
        id: tags
        shell: bash
        run: |
          owner="$(echo $GITHUB_REPOSITORY_OWNER | tr A-Z a-z)"
          short_sha="$(echo $GITHUB_SHA | cut -c1-7)"
          echo "owner=$owner" >> "$GITHUB_OUTPUT"
          echo "short_sha=$short_sha" >> "$GITHUB_OUTPUT"

  build-and-push:
    name: Build ${{ matrix.image }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    needs: [validate-source-ref, prepare]
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: causalagent-app
            context: .
            file: Dockerfile
          - image: causalagent-mcp
            context: .
            file: Agent/CausalAgentMCP/Dockerfile
          - image: causalagent-mysql-primary
            context: Database/mysql
            file: Database/mysql/Dockerfile.primary
          - image: causalagent-mysql-replica
            context: Database/mysql
            file: Database/mysql/Dockerfile.replica
    steps:
      - name: Check out selected develop commit
        uses: actions/checkout@v4

      - name: Show available runner and Docker disk space
        run: |
          df -h /
          docker system df

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # MCP Dockerfile 在复制源码后执行入口导入及运行时依赖边界检查，失败即阻止推送。
      - name: Build, validate and push commit-tagged image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: true
          tags: ghcr.io/${{ needs.prepare.outputs.owner }}/${{ matrix.image }}:sha-${{ needs.prepare.outputs.short_sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Report image digest
        env:
          IMAGE_NAME: ghcr.io/${{ needs.prepare.outputs.owner }}/${{ matrix.image }}
          IMAGE_TAG: sha-${{ needs.prepare.outputs.short_sha }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          df -h /
          {
            echo "### $IMAGE_NAME"
            echo
            echo "| Commit tag | Immutable digest |"
            echo "| --- | --- |"
            echo "| $IMAGE_TAG | $IMAGE_DIGEST |"
            echo
          } >> "$GITHUB_STEP_SUMMARY"
          echo "$IMAGE_NAME:$IMAGE_TAG $IMAGE_DIGEST"

  build-release-bundle:
    name: Package the published images
    needs: [prepare, build-and-push]
    uses: ./.github/workflows/build-release-bundle.yml
    with:
      source_commit: ${{ github.sha }}
      sandbox_image: ${{ inputs.sandbox_image }}
