name: Build release bundle

# 镜像发布成功后复用；手工运行时默认选择最近一次成功发布的 develop 提交。
# 四个自有镜像必须来自同一提交，缺失或 revision 不匹配时直接失败。
on:
  workflow_dispatch:
    inputs:
      release_id:
        description: "发布标识（留空自动生成；仅字母、数字、点、下划线和短横线）"
        required: false
      source_commit:
        description: "源码提交（留空选择最近一次成功的 Publish staging images）"
        required: false
      app_sha256:
        description: "app digest 手动覆盖（留空自动查询，必须属于所选提交）"
        required: false
      mcp_sha256:
        description: "mcp digest 手动覆盖（留空自动查询）"
        required: false
      mysql_primary_sha256:
        description: "mysql-primary digest 手动覆盖（留空自动查询）"
        required: false
      mysql_replica_sha256:
        description: "mysql-replica digest 手动覆盖（留空自动查询）"
        required: false
  workflow_call:
    inputs:
      release_id:
        type: string
        required: false
      source_commit:
        type: string
        required: true
      app_sha256:
        type: string
        required: false
      mcp_sha256:
        type: string
        required: false
      mysql_primary_sha256:
        type: string
        required: false
      mysql_replica_sha256:
        type: string
        required: false

permissions:
  contents: read
  packages: read
  actions: read

jobs:
  build-bundle:
    name: Build deployment bundle
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Select the source version
        id: source
        uses: actions/github-script@v7
        env:
          SOURCE_COMMIT: ${{ inputs.source_commit }}
        with:
          script: |
            let source = process.env.SOURCE_COMMIT.trim();
            if (!source) {
              const { data } = await github.rest.actions.listWorkflowRuns({
                ...context.repo,
                workflow_id: 'publish-staging-images.yml',
                branch: 'develop',
                event: 'workflow_dispatch',
                status: 'success',
                per_page: 1,
              });
              if (!data.workflow_runs.length) {
                core.setFailed('No successful image publication found. Run Publish staging images or specify source_commit.');
                return;
              }
              source = data.workflow_runs[0].head_sha;
            }
            if (!/^[0-9a-f]{7,40}$/i.test(source)) {
              core.setFailed('source_commit must be a Git commit SHA with 7-40 hexadecimal digits.');
              return;
            }
            core.setOutput('ref', source);

      - name: Check out the selected commit
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.source.outputs.ref }}

      - name: Record the full source commit and release ID
        id: version
        env:
          REQUESTED_RELEASE_ID: ${{ inputs.release_id }}
        run: |
          source_commit="$(git rev-parse HEAD)"
          release_id="${REQUESTED_RELEASE_ID:-$(date -u +%Y.%m.%d)-${source_commit:0:7}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}}"
          if [[ ! "$release_id" =~ ^[A-Za-z0-9][A-Za-z0-9._-]{0,99}$ ]]; then
            echo "::error::Invalid release_id: use 1-100 letters, digits, dots, underscores or hyphens, starting with a letter or digit."
            exit 1
          fi
          echo "source_commit=$source_commit" >> "$GITHUB_OUTPUT"
          echo "release_id=$release_id" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve and verify the four published images
        env:
          OWNER: ${{ github.repository_owner }}
          SOURCE_COMMIT: ${{ steps.version.outputs.source_commit }}
          APP_SHA256: ${{ inputs.app_sha256 }}
          MCP_SHA256: ${{ inputs.mcp_sha256 }}
          MYSQL_PRIMARY_SHA256: ${{ inputs.mysql_primary_sha256 }}
          MYSQL_REPLICA_SHA256: ${{ inputs.mysql_replica_sha256 }}
        run: |
          python scripts/resolve_release_images.py \
            --owner "$OWNER" --source-commit "$SOURCE_COMMIT" \
            --app-sha256 "$APP_SHA256" --mcp-sha256 "$MCP_SHA256" \
            --mysql-primary-sha256 "$MYSQL_PRIMARY_SHA256" \
            --mysql-replica-sha256 "$MYSQL_REPLICA_SHA256" \
            --output release-images.json --github-output "$GITHUB_OUTPUT"
        id: images

      - name: Resolve official image digests
        run: python scripts/resolve_official_images.py official-images.json

      - name: Build the deployment bundle
        env:
          RELEASE_ID: ${{ steps.version.outputs.release_id }}
          SOURCE_COMMIT: ${{ steps.version.outputs.source_commit }}
          APP_IMAGE: ${{ steps.images.outputs.app }}
          MCP_IMAGE: ${{ steps.images.outputs.mcp }}
          MYSQL_PRIMARY_IMAGE: ${{ steps.images.outputs.mysql_primary }}
          MYSQL_REPLICA_IMAGE: ${{ steps.images.outputs.mysql_replica }}
        run: |
          python scripts/build_release_bundle.py \
            --output-dir dist/release \
            --release-id "$RELEASE_ID" \
            --source-commit "$SOURCE_COMMIT" \
            --app-image "$APP_IMAGE" \
            --mcp-image "$MCP_IMAGE" \
            --mysql-primary-image "$MYSQL_PRIMARY_IMAGE" \
            --mysql-replica-image "$MYSQL_REPLICA_IMAGE" \
            --images-file official-images.json

      - name: Report the packaged version
        env:
          RELEASE_ID: ${{ steps.version.outputs.release_id }}
          SOURCE_COMMIT: ${{ steps.version.outputs.source_commit }}
        run: |
          {
            echo "### Deployment bundle: $RELEASE_ID"
            echo
            echo "Source commit: $SOURCE_COMMIT"
            echo
            echo '```json'
            cat release-images.json
            echo '```'
            echo
            echo "Download the artifact, upload and extract its tar.gz on the server, then run scripts/deploy.sh."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the deployment bundle
        uses: actions/upload-artifact@v4
        with:
          name: causalagent-release-${{ steps.version.outputs.release_id }}
          path: dist/release/
          retention-days: 30
          if-no-files-found: error
